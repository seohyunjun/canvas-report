/* ── THEME NEWSPRINT ─────────────────────────────────────────────────────────
   NEWSPRINT — press · serif body + oxblood · light-native
   ───────────────────────────────────────────────────────────────────────── */
:root{
  color-scheme: light;
  --bg:#f4e0d1; --surface-1:#efded1; --surface-2:#e2d1c3;
  --text-primary:#160605; --text-secondary:#51403f; --text-muted:#706261;
  --line:#c5b8ad; --line-strong:#a1968d;
  --accent:#651914; --accent-ink:#651914;
  --s1:#73221c; --s2:#38698a; --s3:#2c592f;
  --pos:#155276; --neg:#912e27; --mid:#d9cfc7;
  --focus:#651914;
  --font-display:"Playfair Display","Newsreader",ui-serif,Georgia,serif;
  --font-body:"Crimson Pro","Newsreader",ui-serif,Georgia,serif;
  --font-label:"Newsreader",ui-serif,Georgia,serif;
  --radius:0; --rule:1px; --track-display:-.012em; --label-caps:none;
  --shadow:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#150a06; --surface-1:#190f0b; --surface-2:#281c18;
  --text-primary:#f6e8de; --text-secondary:#a69c95; --text-muted:#807973;
  --line:#322926; --line-strong:#4e4542;
  --accent:#e37f65; --accent-ink:#e37f65;
  --s1:#e37f65; --s2:#7dc0ee; --s3:#669c68;
  --pos:#64a6d4; --neg:#df6a59; --mid:#1f1917;
  --focus:#e37f65;
  --shadow:none;
}}
[data-theme="dark"]{
  color-scheme: dark;
  --bg:#150a06; --surface-1:#190f0b; --surface-2:#281c18;
  --text-primary:#f6e8de; --text-secondary:#a69c95; --text-muted:#807973;
  --line:#322926; --line-strong:#4e4542;
  --accent:#e37f65; --accent-ink:#e37f65;
  --s1:#e37f65; --s2:#7dc0ee; --s3:#669c68;
  --pos:#64a6d4; --neg:#df6a59; --mid:#1f1917;
  --focus:#e37f65;
  --shadow:none;
}
/* [/T] end theme tokens ─────────────────────────────────────────────────── */

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text-primary);
  font-family:var(--font-body); font-size:15px; line-height:1.65; letter-spacing:-.01em}
img{max-width:100%} [hidden]{display:none!important} a{color:var(--accent-ink)}
.wrap{max-width:1120px; margin:0 auto; padding:0 20px 96px}

.masthead{border-bottom:1px solid var(--line); background:var(--surface-1)}
.masthead .wrap{padding:28px 20px 24px; position:relative}
.eyebrow{font-family:var(--font-label); font-size:11.5px; letter-spacing:.12em; text-transform:var(--label-caps);
  color:var(--text-muted); font-weight:600; margin:0 0 8px}
h1{font-family:var(--font-display); font-size:clamp(26px,4.4vw,38px); line-height:1.16; margin:0 0 10px;
  font-weight:700; letter-spacing:var(--track-display)}
.subtitle{margin:0; color:var(--text-secondary); max-width:62ch}
.meta-row{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:16px; font-size:12.5px; color:var(--text-muted)}
.meta-row b{font-weight:600; color:var(--text-secondary)}
.theme-toggle{position:absolute; top:20px; right:20px; background:var(--surface-2); border:var(--rule) solid var(--line);
  color:var(--text-secondary); border-radius:999px; padding:6px 14px; font-size:12.5px; cursor:pointer;
  font-family:var(--font-label)}
.meta-row{font-family:var(--font-label); letter-spacing:.01em}

section{margin-top:56px}
.sec-head{margin-bottom:18px}
.sec-num{font-family:var(--font-label); font-size:11.5px; font-weight:700; color:var(--accent-ink);
  letter-spacing:.12em; text-transform:var(--label-caps)}
h2{font-family:var(--font-display); font-size:clamp(20px,2.9vw,26px); margin:2px 0 6px; font-weight:680;
  letter-spacing:var(--track-display); line-height:1.2}
h3{font-size:15px; margin:0 0 4px; font-weight:650}
.lede{margin:0; color:var(--text-secondary); max-width:74ch; font-size:14.5px}

.card{background:var(--surface-1); border:var(--rule) solid var(--line); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px}
.card-note{font-size:12.5px; color:var(--text-muted); margin:2px 0 14px; max-width:76ch}
.grid{display:grid; gap:16px}
.grid>*, .hero>*, .insights>*{min-width:0}      /* stop a wide table from pushing the grid apart on narrow screens */
.tablewrap{max-width:100%}
@media(min-width:820px){ .grid-2{grid-template-columns:1fr 1fr} }

.hero{display:grid; gap:22px; align-items:start}
@media(min-width:860px){ .hero{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)} }
.hero-fig{font-family:var(--font-display); font-size:clamp(42px,7.4vw,64px); font-weight:700; line-height:1.0;
  letter-spacing:var(--track-display); margin:2px 0 4px}
.hero-unit{font-size:.42em; font-weight:600; color:var(--text-secondary); margin-left:6px}
.hero-label{font-size:13px; color:var(--text-muted); font-weight:600}
.hero-sub{margin:10px 0 0; color:var(--text-secondary); font-size:14px}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
@media(min-width:520px){ .tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))} }  /* 2 up at 520px, more as the row allows — a hard repeat(2) here killed the auto-fit above it */
.tile{background:var(--surface-1); border:var(--rule) solid var(--line); border-radius:var(--radius); padding:14px 15px 12px}
.tile-label{font-family:var(--font-label); font-size:11.5px; color:var(--text-muted); font-weight:600;
  letter-spacing:.06em; text-transform:var(--label-caps); display:flex; align-items:center; gap:6px}
.tile-value{font-family:var(--font-display); font-size:26px; font-weight:680; letter-spacing:var(--track-display);
  margin:4px 0 2px; line-height:1.12}
.tile-value small{font-size:13px; font-weight:600; color:var(--text-secondary)}
.tile-delta{font-size:12.5px; font-weight:600}
.tile canvas{display:block; width:100%; height:30px; margin-top:8px}
.up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--text-muted)}

.insights{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.insight{background:var(--surface-1); border:var(--rule) solid var(--line); border-left:3px solid var(--s1);
  border-radius:var(--radius); padding:16px 17px}
.insight.warn{border-left-color:var(--s2)} .insight.neut{border-left-color:var(--text-muted)}
.insight h3{font-size:14.5px; margin-bottom:6px}
.insight p{margin:0; font-size:13.5px; color:var(--text-secondary)}
.insight .fig{font-weight:680; color:var(--text-primary); font-variant-numeric:tabular-nums}

.toolbar{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin-bottom:16px;
  padding:11px 14px; background:var(--surface-1); border:var(--rule) solid var(--line); border-radius:var(--radius)}
.toolbar .grp{display:flex; align-items:center; gap:8px}
.toolbar label{font-family:var(--font-label); font-size:11.5px; color:var(--text-muted); font-weight:600;
  letter-spacing:.06em; text-transform:var(--label-caps)}
.segmented{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px}
.segmented button{border:0; background:transparent; color:var(--text-secondary); font:inherit; font-size:12.5px;
  font-weight:600; padding:5px 13px; border-radius:999px; cursor:pointer}
.segmented button[aria-pressed="true"]{background:var(--surface-1); color:var(--text-primary); box-shadow:0 1px 2px rgba(0,0,0,.08)}
select,input[type=range]{font:inherit; font-size:13px}
select{background:var(--surface-2); color:var(--text-primary); border:1px solid var(--line); border-radius:8px; padding:5px 9px}
input[type=range]{accent-color:var(--s1); width:132px}
.btn{border:1px solid var(--line); background:var(--surface-2); color:var(--text-secondary); font:inherit;
  font-size:12.5px; font-weight:600; border-radius:8px; padding:5px 11px; cursor:pointer}
.btn:hover{border-color:var(--line-strong); color:var(--text-primary)}
:is(button,select,input,[tabindex]):focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}

.chart{position:relative; width:100%}
.chart canvas{display:block; width:100%; height:240px; max-height:480px; touch-action:pan-y}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; margin:2px 0 10px; font-size:12.5px; color:var(--text-secondary)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.key{width:14px; height:3px; border-radius:2px; flex:none}
.key.sq{width:11px; height:11px; border-radius:3px}
.scale-legend{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--text-muted); margin:2px 0 10px}
.scale-bar{height:9px; width:150px; border-radius:5px}

/* ── tooltips: the value tooltip and the help tooltip share one engine ─────── */
.tt{position:fixed; z-index:60; pointer-events:none; background:var(--surface-1); color:var(--text-primary);
  border:1px solid var(--line-strong); border-radius:10px; padding:9px 11px; font-size:12.5px; min-width:132px;
  max-width:min(320px, calc(100vw - 24px)); box-shadow:0 6px 20px -8px rgba(0,0,0,.35); opacity:0;
  transition:opacity .08s linear; line-height:1.55}
.tt.on{opacity:1}
.tt.help{max-width:min(340px, calc(100vw - 24px))}
.tt .tt-title{font-weight:670; margin-bottom:5px}
.tt .tt-row{display:flex; align-items:center; gap:8px; justify-content:space-between; margin-top:3px}
.tt .tt-name{color:var(--text-secondary); display:flex; align-items:center; gap:6px}
.tt .tt-val{font-weight:670; font-variant-numeric:tabular-nums}
.tt .tt-body{color:var(--text-secondary)}
.tt .tt-note{color:var(--text-muted); font-size:11.5px; margin-top:6px; border-top:1px solid var(--line); padding-top:5px}
/* help affordances: dotted underline (a term) / question chip (a chart or section) */
[data-help]{cursor:help}
.help-term{border-bottom:1px dashed var(--line-strong); text-underline-offset:3px}
.help-dot{display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; flex:none;
  border-radius:999px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--text-muted);
  font:inherit; font-size:11px; font-weight:700; line-height:1; cursor:help; padding:0; vertical-align:middle}
.help-dot:hover{color:var(--text-primary); border-color:var(--text-muted)}

.tablewrap{overflow-x:auto; margin-top:14px; border:var(--rule) solid var(--line); border-radius:var(--radius)}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:520px}
th,td{padding:8px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left; white-space:normal; min-width:130px}
thead th{background:var(--surface-2); color:var(--text-secondary); font-weight:640; font-size:12px; position:sticky; top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums}
th.sortable{cursor:pointer; user-select:none}
th.sortable[aria-sort="descending"]::after{content:" ▾"} th.sortable[aria-sort="ascending"]::after{content:" ▴"}
caption{caption-side:top; text-align:left; font-size:12.5px; color:var(--text-muted); padding:9px 12px}

.tabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:2px}
.tabs button{border:0; border-bottom:2px solid transparent; background:none; font:inherit; font-size:13.5px;
  font-weight:600; color:var(--text-muted); padding:8px 12px; cursor:pointer; margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text-primary); border-bottom-color:var(--s1)}
.drill{margin-top:14px; background:var(--surface-2); border:var(--rule) solid var(--line); border-radius:var(--radius); padding:14px 16px}
.drill h4{margin:0 0 8px; font-size:14.5px}
.drill dl{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:10px 16px; margin:0}
.drill dt{font-size:12px; color:var(--text-muted); font-weight:600}
.drill dd{margin:1px 0 0; font-size:15px; font-weight:660; font-variant-numeric:tabular-nums}
.pill{display:inline-block; font-size:11.5px; font-weight:650; padding:2px 8px; border-radius:999px;
  background:var(--surface-2); color:var(--text-secondary); border:1px solid var(--line)}
.method{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.method h3{font-size:14px; margin-bottom:5px}
.method p,.method li{font-size:13px; color:var(--text-secondary); margin:0}
.method ul{margin:0; padding-left:17px} .method li + li{margin-top:5px}
footer{margin-top:56px; padding-top:20px; border-top:1px solid var(--line); font-size:12.5px; color:var(--text-muted)}

/* ============================================================================
 * [S] structure layer — macrostructures · archetypes · motion
 * references/macrostructures/*.md and references/components.md compose these
 * classes into "same runtime, different report". Do not delete this block.
 * ==========================================================================*/

/* ── masthead archetypes M1-M6 ────────────────────────────────────────────── */
.masthead--rule{border-top:4px solid var(--text-primary)}
.masthead--rule .wrap{padding-top:20px}

/* Only M2 lays the figure beside the title; every other archetype hides it, and
   .mast-main keeps the label stack one grid child rather than four. */
.masthead .mast-fig[hidden]{display:none}
.masthead--figure .wrap{display:grid; gap:18px 40px; align-items:end}
@media(min-width:820px){ .masthead--figure .wrap{grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr)} }
.masthead--figure .mast-fig{font-family:var(--font-display); font-size:clamp(46px,8vw,84px); line-height:.92;
  letter-spacing:var(--track-display); font-weight:700; margin:0; text-align:right}
.masthead--figure .mast-fig small{display:block; font-family:var(--font-label); font-size:12px; font-weight:600;
  letter-spacing:.1em; text-transform:var(--label-caps); color:var(--text-muted); margin-top:6px}

.masthead--broadsheet{border-top:6px solid var(--text-primary); border-bottom:3px double var(--line-strong); text-align:center}
.masthead--broadsheet h1{font-size:clamp(30px,6.4vw,58px); margin:6px 0 8px}
.masthead--broadsheet .subtitle{margin-inline:auto}
.masthead--broadsheet .meta-row{justify-content:center; border-top:1px solid var(--line); padding-top:10px}

.masthead--index .wrap{display:grid; gap:20px 40px}
@media(min-width:860px){ .masthead--index .wrap{grid-template-columns:minmax(0,1fr) minmax(0,300px)} }
.mast-index{margin:0; padding:0; list-style:none; border-top:var(--rule) solid var(--line-strong);
  font-family:var(--font-label); font-size:12.5px}
.mast-index li{border-bottom:var(--rule) solid var(--line)}
.mast-index a{display:flex; justify-content:space-between; gap:12px; padding:7px 0; text-decoration:none;
  color:var(--text-secondary)}
.mast-index a:hover{color:var(--text-primary)}
.mast-index b{font-variant-numeric:tabular-nums; color:var(--text-primary); font-weight:660}

.masthead--rail .wrap{display:grid; grid-template-columns:auto minmax(0,1fr); gap:24px}
.mast-rail{font-family:var(--font-label); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--text-muted); writing-mode:vertical-rl; transform:rotate(180deg); align-self:stretch;
  border-right:var(--rule) solid var(--line); padding-right:10px}
@media(max-width:640px){ .masthead--rail .wrap{grid-template-columns:1fr} .mast-rail{display:none} }

.masthead--sticky{position:sticky; top:0; z-index:40; transition:padding .18s ease}
.masthead--sticky.shrunk .wrap{padding-top:10px; padding-bottom:10px}
.masthead--sticky.shrunk h1{font-size:17px; margin-bottom:0}
.masthead--sticky.shrunk .subtitle,.masthead--sticky.shrunk .meta-row,.masthead--sticky.shrunk .eyebrow{display:none}

/* ── section-head archetypes S1-S5 ────────────────────────────────────────── */
.sec-head--hang{display:grid; gap:4px 20px}
@media(min-width:900px){ .sec-head--hang{grid-template-columns:76px minmax(0,1fr)}
  .sec-head--hang .sec-num{grid-row:span 3; padding-top:7px; text-align:right} }
.sec-head--rule{border-top:2px solid var(--text-primary); padding-top:10px}
.sec-head--rule .sec-num{float:left; margin-right:12px; line-height:1.9}
.sec-head--rule .lede{clear:left; margin-top:6px}
.sec-head--pinned{position:sticky; top:0; z-index:30; background:var(--bg); padding:12px 0 10px;
  border-bottom:var(--rule) solid var(--line); margin-bottom:16px}
.sec-head--ask h2{font-size:clamp(23px,3.6vw,33px); max-width:22ch}

/* ── insight archetypes I1-I5 ─────────────────────────────────────────────── */
.insights--ledger{display:block; border-top:2px solid var(--text-primary)}
.insights--ledger .insight{background:none; border:0; border-bottom:var(--rule) solid var(--line); border-radius:0;
  padding:14px 0; display:grid; gap:4px 24px}
@media(min-width:760px){ .insights--ledger .insight{grid-template-columns:minmax(0,22ch) minmax(0,1fr)} }
.insight--quote{border-left:0; border-top:3px solid var(--s1)}
.insight--quote h3{font-family:var(--font-display); font-size:clamp(18px,2.4vw,23px); line-height:1.28; font-weight:600}
.insight--stat{display:grid; gap:2px}
.insight--stat .fig-big{font-family:var(--font-display); font-size:clamp(28px,4vw,40px); line-height:1.02;
  letter-spacing:var(--track-display); font-weight:700}
.insight--margin{background:none; border:0; border-left:var(--rule) solid var(--line-strong); border-radius:0;
  padding:2px 0 2px 14px; font-size:13px}

/* ── chart-card archetypes C1-C5 ──────────────────────────────────────────── */
.card--hairline{background:none; border:0; border-top:2px solid var(--text-primary);
  border-bottom:var(--rule) solid var(--line); border-radius:0; box-shadow:none; padding:16px 0 20px}
.card--bleed{border-radius:0; border-left:0; border-right:0; box-shadow:none}
@media(min-width:1160px){ .card--bleed{margin-inline:calc(50% - 50vw); padding-inline:max(20px, calc(50vw - 560px))} }
.card--inset{background:var(--surface-2); box-shadow:none}
.card--split{display:grid; gap:18px 22px}
@media(min-width:980px){ .card--split{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); align-items:start}
  .card--split .tablewrap{margin-top:0; max-height:420px; overflow:auto} }

/* ── macro layouts ────────────────────────────────────────────────────────── */
/* 04 Workbench: sticky filter rail on the left */
.layout-rail{display:grid; gap:26px}
@media(min-width:1000px){ .layout-rail{grid-template-columns:236px minmax(0,1fr)}
  .layout-rail > .rail{position:sticky; top:16px; align-self:start; max-height:calc(100vh - 32px); overflow:auto} }
.rail{display:grid; gap:14px; padding:16px; background:var(--surface-1);
  border:var(--rule) solid var(--line); border-radius:var(--radius)}
.rail .grp{display:grid; gap:6px}

/* 05 Broadsheet: newspaper columns */
.layout-broadsheet{column-gap:34px; column-rule:var(--rule) solid var(--line)}
@media(min-width:900px){ .layout-broadsheet{column-count:2} }
@media(min-width:1240px){ .layout-broadsheet{column-count:3} }
.layout-broadsheet > *{break-inside:avoid; margin-bottom:20px}
.span-all{column-span:all}

/* 06 Poster/Almanac: dense small-multiple grid.
   Canvas height comes from the <canvas height="104"> ATTRIBUTE, not CSS —
   fit() reads the attribute and overwrites style.height. */
.layout-poster{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.layout-poster .card{padding:13px}
.layout-poster .card h3{font-size:13px}
.layout-poster .card .tile-value{font-size:21px}

/* 07 Deck: viewport-height sections + scroll snap */
.layout-deck{scroll-snap-type:y proximity}
.layout-deck > section{min-height:min(94vh,880px); display:flex; flex-direction:column; justify-content:center;
  scroll-snap-align:start; padding-block:36px}
@media(prefers-reduced-motion:reduce){ .layout-deck{scroll-snap-type:none} }

/* 03 Scrollytelling: pinned canvas + steps */
.layout-scrolly{display:grid; gap:24px}
@media(min-width:940px){ .layout-scrolly{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
  .layout-scrolly .stick{position:sticky; top:14vh; align-self:start} }
.steps{display:grid; gap:min(46vh,360px)}
.step{background:var(--surface-1); border:var(--rule) solid var(--line); border-radius:var(--radius);
  padding:18px 19px; opacity:.42; transition:opacity .3s ease}
.step.on{opacity:1; border-color:var(--line-strong)}
@media(prefers-reduced-motion:reduce){ .step{opacity:1} }

/* 10 Field notes: body text + marginalia column */
.layout-margin{display:grid; gap:14px 26px}
@media(min-width:1040px){ .layout-margin{grid-template-columns:minmax(0,200px) minmax(0,1fr)}
  .layout-margin > .marginalia{text-align:right} }
.marginalia{font-family:var(--font-label); font-size:12px; color:var(--text-muted); line-height:1.5}

/* 02 Ledger: the metric index table */
.ledger{width:100%; border-collapse:collapse; font-size:13.5px; min-width:0}
.ledger th,.ledger td{border-bottom:var(--rule) solid var(--line); padding:9px 10px}
.ledger tbody tr{cursor:pointer}
.ledger tbody tr[aria-expanded="true"]{background:var(--surface-2)}

/* ── motion ───────────────────────────────────────────────────────────────── */
/* Content is visible from its default state. If IntersectionObserver or the
   script fails, nothing may disappear. */
.reveal{opacity:1; transform:none}
.reveal.in{animation:reveal-in .48s cubic-bezier(.22,.61,.36,1) both}
@keyframes reveal-in{from{opacity:.15; transform:translateY(10px)}to{opacity:1; transform:none}}
@media(prefers-reduced-motion:reduce){ .reveal.in{animation:none} }
.counting{font-variant-numeric:tabular-nums}
/* [/S] end structure layer ───────────────────────────────────────────────── */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; transition-duration:.001ms!important} }
</style>
</head>

d would have put these measures, 1,034 to 1,606 resolutions against 1,644.5 to 2,565.5 hours, in one corner of an empty plot. The builder now compiles VIZ.scatter, which takes its domain from the data, so the lens is drawn on the evidence that always supported it. distribution stays rejected: the honest distribution here is of a derived monthly ratio, not of a source column. cohort is rejected because the file has no entity to follow across periods. comparison is ineligible without a dimension column.","rule_id":"LENS-ELIGIBILITY-001"},{"decision":"Broadsheet chosen from the compatible, non-excluded set (Bridge, Broadsheet). The subject is an argument in prose — an identity and what follows from it — which is what a broadsheet carries; Bridge was rejected because its waterfall is outside the deterministic builder's chart vocabulary, so declaring it would promise a form this build cannot compile. Briefing is rotation-excluded as the previous run's macro.","rule_id":"MACRO-SELECTION-001"},{"decision":"newsprint, rotation distance 2 from the previous run's cobalt and non-excluded. Its press character — cream paper, roman serif, oxblood accent, ruled rather than raised cards — is the face of the multi-column argument this report is, and it is the theme the catalogue names for multi-column argument.","rule_id":"THEME-SELECTION-001"},{"decision":"Two influences, both portable-pattern: the D3 gallery for the line, column and dot vocabulary, and Motion for the single entry curve. Nothing is inlined and no network request is made — a vendored runtime would add weight to a report with one animation, which is the smaller of the two honest integrations.","rule_id":"TOOL-SELECTION-001"},{"decision":"Four claims, each naming its observed values, its comparison basis and its limitation. The comparison that could be overstated — the two yearly medians of hours per resolved ticket — is stated as magnitudes and explicitly not claimed as a change, because a 24-month series cannot earn NAL-STATE-001"},{"decision":"Under prefers-reduced-motion the shell omits the entry animation and paints the final state directly; nothing in the report's meaning is carried by the movement.","rule_id":"MOTION-REDUCED-001"},{"decision":"The run was taken through the state machine to COMPLETE: plan rules, build, responsive render and real-clock motion gates all pass, and the published file is the artifact those gates ran against.","rule_id":"FINAL-CHECKS-001"}],"schema_version":"1.0","sections":[{"id":"lead","lede":"Month-end backlog is the only column in this file that carries memory. Every other figure describes one month and stops; this one adds that month to everything before it. It opens at 268 tickets and closes at 1,392, and the shape between those two points is the subject of the rest of the page. Read it as a level, not a flow: two neighbouring columns are two photographs of the same pile, not two additions to it.","title":"The pile is the sum of the gaps"},{"id":"intake","lede":"Tickets opened each month, with the resolution figure beside it in the table. The two series are close enough that the interesting quantity is their difference, so the columns carry intake alone and the scatter underneath puts the two against each other directly. Its dashed line is resolved = opened: 18 of the 24 months sit below it, and those 18 months are the whole of the backlog's growth.","title":"Both sides grew"},{"id":"effort","lede":"Recorded handling hours, month by month, and then against the resolutions they were spent on. This second chart was missing from the first version of this report, and the reason it was missing is now gone: the only scatter the builder could draw anchored both axes at zero, and neither of these measures comes within a third of the origin, so all 24 months would have collapsed into one corner. VIZ.scatter takes its range from the data, and the relationship is legible at last — the hours track the resolutions, inside the narrow per-ticket band the
