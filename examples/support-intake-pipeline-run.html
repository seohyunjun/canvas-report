  else { ctx.moveTo(x,y+h); ctx.lineTo(x,y-r); ctx.quadraticCurveTo(x,y,x+r,y);
         ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y-r); ctx.lineTo(x+w,y+h); }
  ctx.closePath(); ctx.fill();
}
function barH(ctx,x,y,w,h,r){ /* horizontal bar: x is the baseline, x+w the data end */
  r=Math.min(r,Math.abs(h)/2,Math.abs(w));
  ctx.beginPath();
  if(w>=0){ ctx.moveTo(x,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
            ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x,y+h); }
  else { ctx.moveTo(x,y); ctx.lineTo(x+w+r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
         ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w+r,y+h); ctx.lineTo(x,y+h); }
  ctx.closePath(); ctx.fill();
}
function txt(ctx,s,x,y,align,color,weight,size){
  ctx.save(); ctx.fillStyle=color||T.text2; ctx.font=(weight||'600')+' '+(size||11.5)+'px system-ui, sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); ctx.restore();
}
function ell(ctx,s,max){ s=String(s);
  if(ctx.measureText(s).width<=max) return s;
  var t=s; while(t.length>1 && ctx.measureText(t+'…').width>max) t=t.slice(0,-1);
  return t+'…';
}
function fld(f){ return typeof f==='function'?f:function(r){ return r[f]; }; }
/* ── missing-value guard ───────────────────────────────────────────────────
   A null/NaN/string reaching a canvas coordinate makes the mark vanish with no
   error at all. Filter at the factory door, and PRINT how many rows were
   dropped — never hide it. */
function fin(v){ return finiteNumber(v); }        /* short alias for finiteNumber */
function usable(rows, getters){
  var out=[], drop=0;
  for(var i=0;i<rows.length;i++){
    var ok=true;
    for(var g=0;g<getters.length;g++){ if(fin(getters[g](rows[i]))===null){ ok=false; break; } }
    if(ok) out.push(rows[i]); else drop++;
  }
  out.dropped=drop; return out;
}
function dropNote(ctx,W,H,rows){
  if(!rows.dropped) return;
  txt(ctx, str('rowsOmitted',{n:rows.dropped}), W-6, H-6, 'right', T.muted, '600', 10.5);
}
/* keep a value label inside the plot */
function clampLabel(ctx,s,x,align,lo,hi){
  var w=ctx.measureText(String(s)).width;
  var left = align==='right' ? x-w : (align==='center' ? x-w/2 : x);
  if(left<lo) left=lo;
  if(left+w>hi) left=hi-w;
  return align==='right' ? left+w : (align==='center' ? left+w/2 : left);
}
/* when a factory cannot take negatives, say so instead of drawing garbage */
function needsNonNegative(ctx,W,H,rows,get,alt){
  for(var i=0;i<rows.length;i++){ if(get(rows[i])<0){
    chartMessage(ctx,W,H,str('negativeUnsupported',{alt:alt}));
    return true; } }
  return false;
}
function chartMessage(ctx,W,H,message){
  var s=String(message||str('noData')), max=W-24;
  ctx.save(); ctx.font='600 12px system-ui, sans-serif';
  if(ctx.measureText(s).width<=max){ ctx.restore(); txt(ctx,s,W/2,H/2,'center',T.muted,'600',12); return; }
  /* wrap to two lines, then truncate, so the message stays on the canvas */
  var words=s.split(' '), a='', b='';
  for(var i=0;i<words.length;i++){
    var t=a?a+' '+words[i]:words[i];
    if(ctx.measureText(t).width<=max) a=t; else b=b?b+' '+words[i]:words[i];
  }
  var l1=ell(ctx,a,max), l2=b?ell(ctx,b,max):'';
  ctx.restore();
  txt(ctx,l1,W/2,H/2-(l2?9:0),'center',T.muted,'600',12);
  if(l2) txt(ctx,l2,W/2,H/2+9,'center',T.muted,'600',12);
}
function finiteNumber(v){ var n=Number(v); return isFinite(n)?n:null; }
/* Wilson score interval for a proportion. Reports quote shares constantly —
   "13.5% of trades were direct" — and a share from 40 rows is not the same claim
   as a share from 4,000. This is the cheap honest one: no normal approximation
   collapse at p near 0 or 1, no simulation, exact in three lines.
   Returns fractions, not percentages. references/uncertainty.md says when to use it. */
function wilson(k,n,z){
  k=Number(k); n=Number(n); z=Number(z)||1.96;          /* 1.96 = 95% */
  if(!isFinite(k)||!isFinite(n)||n<=0||k<0||k>n) return null;
  var p=k/n, z2=z*z, d=1+z2/n;
  var centre=(p+z2/(2*n))/d;
  var half=(z*Math.sqrt(p*(1-p)/n + z2/(4*n*n)))/d;
  return {p:p, lo:Math.max(0,centre-half), hi:Math.min(1,centre+half), n:n, k:k};
}
/* Pass colours as TOKEN NAMES ('s1', 'pos'...). Resolving at draw time is what
   makes a chart follow the theme toggle; a hard-coded hex will not. */
function colorOf(v,dflt){
  if(v==null) return dflt||T.s1;
  if(typeof v==='function') return v();
  return (T[v]!==undefined && typeof T[v]==='string') ? T[v] : v;
}

/* ============================================================================
 * VIZ — chart factories. Every factory takes (canvas, cfg) and returns a handle.
 * Shared cfg: rows, tip(row,i)->{title,rows,note}, format(v)->string
 * ==========================================================================*/
var VIZ={};

/* line: one series + area wash + crosshair. Time axis only. */
VIZ.line=function(cvs,cfg){
  var X=fld(cfg.x), Y=fld(cfg.y), fmt=cfg.format||nf;
  return mk(cvs,function(ctx,W,H,c){
    var col=colorOf(cfg.color), rows=usable(cfg.rows(),[Y]), pad={l:cfg.padLeft||58,r:22,t:16,b:26};
    if(!rows.length) return;
    var vals=rows.map(Y), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
    var pv=(mx-mn)*0.18||1, lo=cfg.zeroBased?0:mn-pv, hi=mx+pv;
    var PW=W-pad.l-pad.r, PH=H-pad.t-pad.b;
    var px=function(i){ return pad.l+(rows.length<2?PW/2:PW*i/(rows.length-1)); };
    var py=function(v){ return pad.t+PH*(1-(v-lo)/(hi-lo)); };
    gridY(ctx,W,pad,ticks(lo,hi,4).map(function(v){return {v:v,y:py(v)};}), cfg.tickFormat||compact);
    var n=Math.min(rows.length, Math.max(1,Math.round(rows.length*c.t)));  /* never run past the number of rows */
    ctx.save(); ctx.beginPath();
    for(var i=0;i<n;i++){ var x=px(i),y=py(vals[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.lineTo(px(n-1),pad.t+PH); ctx.lineTo(px(0),pad.t+PH); ctx.closePath();
    ctx.fillStyle=rgba(col,.10); ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath();
    for(var j=0;j<n;j++){ var xx=px(j),yy=py(vals[j]); j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
    ctx.stroke(); ctx.restore();
    /* x labels: drop any that would collide */
    ctx.save(); ctx.fillStyle=T.muted; ctx.font='11px system-ui, sans-serif'; ctx.textBaseline='top';
    var step=Math.max(1,Math.ceil(rows.length/(W>560?7:4))), picks=[], last=-1e9, gap=52;
    for(var k=0;k<rows.length;k+=step) picks.push(k);
    if(picks[picks.length-1]!==rows.length-1) picks.push(rows.length-1);
    while(picks.length>2 && px(picks[picks.length-1])-px(picks[picks.length-2])<gap) picks.splice(picks.length-2,1);
    picks.forEach(function(i){
      if(px(i)-last<gap && i!==rows.length-1) return; last=px(i);
      ctx.textAlign=i===0?'left':(i===rows.length-1?'right':'center');
      ctx.fillText(X(rows[i]), Math.min(W-pad.r,Math.max(pad.l,px(i))), pad.t+PH+8);
    });
    ctx.restore();
    if(c.t>=1){                                   /* endpoint marker + the one direct value label */
      var lx=px(rows.length-1), ly=py(vals[vals.length-1]);
      ctx.fillStyle=T.surface; ctx.beginPath(); ctx.arc(lx,ly,6,0,7); ctx.fill();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(lx,ly,4,0,7); ctx.fill();
      txt(ctx,fmt(vals[vals.length-1]),lx-9,ly-13,'right',T.text,'680',12);
      var mi=vals.indexOf(mx);
      if(mi>=0 && mi<vals.length-4 && rows.length>6)
        txt(ctx,(cfg.maxLabel||str('top'))+fmt(mx),px(mi),py(mx)-13, mi>rows.length*.7?'right':'left',T.muted,'600',11);
    }
    if(c.hover){                                  /* crosshair: the reader aims at an x position, not a point */
      var hx=px(c.hover.i);
      ctx.save(); ctx.strokeStyle=T.lineStrong; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(Math.round(hx)+.5,pad.t); ctx.lineTo(Math.round(hx)+.5,pad.t+PH); ctx.stroke();
      var hy=py(vals[c.hover.i]);
      ctx.fillStyle=T.surface; ctx.beginPath(); ctx.arc(hx,hy,7,0,7); ctx.fill();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(hx,hy,4.5,0,7); ctx.fill(); ctx.restore();
    }
    var bw=PW/Math.max(1,rows.length-1);
    rows.forEach(function(r,i){
      var d=cfg.tip?cfg.tip(r,i,rows):{title:String(X(r)),rows:[{name:cfg.seriesName||str('value'),val:fmt(Y(r)),color:col}]};
      c.hits.push({x:px(i)-bw/2,y:pad.t,w:bw,h:PH,i:i,title:d.title,rows:d.rows,note:d.note});
    });
  },{repaintOnHover:true});
};

/* grouped columns: 2-3 series IN THE SAME UNIT. Different units -> VIZ.panels. */
VIZ.columns=function(cvs,cfg){
  var X=fld(cfg.x), ser=cfg.series.map(function(s){ return {name:s.name,get:fld(s.get),color:s.color}; });
  return mk(cvs,function(ctx,W,H,c){
    ser.forEach(function(s,i){ s.hex=colorOf(s.color, T.series[i%3]); });
    var rows=usable(cfg.rows(), ser.map(function(s){return s.get;})), pad={l:58,r:16,t:16,b:26};
    if(!rows.length) return;
    var mx=Math.max.apply(null, rows.map(function(r){ return Math.max.apply(null, ser.map(function(s){return s.get(r);})); }));
    if(needsNonNegative(ctx,W,H,rows,function(r){ return Math.min.apply(null, ser.map(function(s){return s.get(r);})); },'VIZ.divColumns')) return;
    var tk=ticks(0,mx*1.08,4), hi=Math.max(tk[tk.length-1]||0, mx*1.04, 1e-9);  /* the axis must always cover the data */
    var PW=W-pad.l-pad.r, PH=H-pad.t-pad.b, py=function(v){ return pad.t+PH*(1-v/hi); };
    gridY(ctx,W,pad,tk.map(function(v){return {v:v,y:py(v)};}), cfg.tickFormat||compact);
    var slot=PW/rows.length, gap=2, bw=Math.min(24,(slot-6-gap*(ser.length-1))/ser.length);
    rows.forEach(function(r,i){
      var x0=pad.l+slot*i+(slot-(bw*ser.length+gap*(ser.length-1)))/2;
      ser.forEach(function(s,si){
        var h=(PH*s.get(r)/hi)*c.t;
        ctx.fillStyle=s.hex; barV(ctx, x0+si*(bw+gap), pad.t+PH-h, bw, h, 4);
      });
      var d=cfg.tip?cfg.tip(r,i,rows):{title:String(X(r)),
        rows:ser.map(function(s){ return {name:s.name,val:(cfg.format||nf)(s.get(r)),color:s.hex}; })};
      c.hits.push({x:pad.l+slot*i,y:pad.t,w:slot,h:PH,title:d.title,rows:d.rows,note:d.note});
    });
    ctx.save(); ctx.fillStyle=T.muted; ctx.font='11px system-ui, sans-serif';
    ctx.textBaseline='top'; ctx.textAlign='center';
    var step=Math.max(1,Math.ceil(rows.length/(W>560?6:3))), last=-1e9;
    rows.forEach(function(r,i){ if(i%step) return;
      var x=pad.l+slot*i+slot/2; if(x-last<50||x>W-pad.r-24) return; last=x;
      ctx.fillText(ell(ctx,X(r),slot*step-6), x, pad.t+PH+8); });
    ctx.restore();
    dropNote(ctx,W,H,rows);
  });
};

/* diverging columns (histogram, deltas): colour splits on sign */
VIZ.divColumns=function(cvs,cfg){
  var X=fld(cfg.x), Y=fld(cfg.y), fmt=cfg.format||nf;
  return mk(cvs,function(ctx,W,H,c){
    /* rotated labels plus an axis note need more room underneath */
    var rows=usable(cfg.rows(),[Y]), pad={l:52,r:12,t:cfg.padTop||18,
      b:(cfg.rotate?52:30)+(cfg.axisNote?14:0)};
    if(!rows.length) return;
    var mx=Math.max.apply(null,rows.map(Y));
    if(needsNonNegative(ctx,W,H,rows,Y,'VIZ.divHbars or VIZ.waterfall')) return;
    var tk=ticks(0,mx*1.06,4), hi=Math.max(tk[tk.length-1]||0,mx*1.06,1e-9);
    var PW=W-pad.l-pad.r, PH=H-pad.t-pad.b, py=function(v){ return pad.t+PH*(1-v/hi); };
    gridY(ctx,W,pad,tk.map(function(v){return {v:v,y:py(v)};}), cfg.tickFormat||compact);
    var slot=PW/rows.length, bw=Math.min(26,slot-3), half=(rows.length-1)/2;
    rows.forEach(function(r,i){
      var cx=pad.l+slot*i+slot/2;
      var t01=cfg.sign?cfg.sign(r,i,rows):(i<half?-(half-i)/half:(i-half)/half);
      /* cfg.colorOf wins; a plain cfg.color token makes it a single-hue histogram
         (a distribution of a positive quantity has no direction to encode); with
         neither, it diverges around the midpoint as a signed histogram should. */
      var col=cfg.colorOf?cfg.colorOf(r,i,rows)
             :cfg.color?colorOf(cfg.color)
             :diverge(t01<0?Math.min(-.35,t01):Math.max(.35,t01));
      var h=(PH*Y(r)/hi)*c.t;
      ctx.fillStyle=col; barV(ctx,cx-bw/2,pad.t+PH-h,bw,h,4);
      if(c.t>=1 && Y(r)/mx>0.08) txt(ctx,compact(Y(r)),cx,pad.t+PH-h-11,'center',T.text2,'650',11);
      var d=cfg.tip?cfg.tip(r,i,rows):{title:String(X(r)),rows:[{name:cfg.seriesName||str('value'),val:fmt(Y(r)),color:col}]};
      c.hits.push({x:cx-slot/2,y:pad.t,w:slot,h:PH,title:d.title,rows:d.rows,note:d.note});
    });
    ctx.save(); ctx.fillStyle=T.muted; ctx.font='10.5px system-ui, sans-serif'; ctx.textBaseline='top';
    rows.forEach(function(r,i){
      var cx=pad.l+slot*i+slot/2;
      if(cfg.rotate){ ctx.save(); ctx.translate(cx,pad.t+PH+8); ctx.rotate(-Math.PI/4);
        /* a rotated label is bounded by the diagonal; untruncated it runs off the left */
        ctx.textAlign='right'; ctx.fillText(ell(ctx,X(r),(pad.b-14)*1.414),0,0); ctx.restore(); }
      else { ctx.textAlign='center'; ctx.fillText(ell(ctx,X(r),slot-4), cx, pad.t+PH+8); }
    });
    ctx.restore();
    if(cfg.axisNote) txt(ctx,cfg.axisNote,pad.l+PW/2,H-8,'center',T.muted,'600',11);
    if(cfg.topNote) txt(ctx,cfg.topNote,pad.l,12,'left',T.muted,'600',11);
    dropNote(ctx,W,H,rows);
  });
};

/* histogram: the shape of ONE distribution, binned from the raw measure.
   VIZ.divColumns draws a distribution that is already binned — one row per bin,
   which is what you have after a GROUP BY. This takes the column itself, which
   is what you have when the source is one row per event, and the difference
   matters: pre-binning upstream is a decision the reader cannot see.
   The bin count is Sturges, clamped to 5-30, and PRINTED with the width. A
   histogram whose binning is invisible is a picture rather than evidence, and
   the same values under a different bin count tell a different story.
   cfg: rows, value, format, bins (override), axisNote */
VIZ.histogram=function(cvs,cfg){
  var V=fld(cfg.value), fmt=cfg.format||compact;
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(),[V]), pad={l:52,r:14,t:18,b:46};
    if(rows.length<2){ chartMessage(ctx,W,H,str('histogramMin')); return; }
    var vals=rows.map(V), lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
    if(!(hi>lo)){ chartMessage(ctx,W,H,str('histogramFlat')); return; }
    var k=finiteNumber(cfg.bins)||(Math.ceil(Math.log(rows.length)/Math.LN2)+1);
    k=Math.max(5,Math.min(30,Math.round(k)));
    var width=(hi-lo)/k, bins=[];
    for(var b=0;b<k;b++) bins.push({lo:lo+width*b, hi:lo+width*(b+1), n:0});
    /* the maximum belongs in the last bin, not in a k+1th one off the axis */
    vals.forEach(function(v){ bins[Math.min(k-1,Math.floor((v-lo)/width))].n++; });
    var mx=Math.max.apply(null,bins.map(function(x){ return x.n; }))||1;
    /* A bin count is a whole number of rows. ticks() spaces a small range in
       fractions, and rounding those for display prints "1 1 1 0 0 0" up the
       axis — six gridlines claiming three values. Step in integers instead, and
       round the top UP to one so the tallest bar has headroom. */
    var step=Math.max(1,Math.ceil(mx/4)), top=Math.ceil(mx*1.06/step)*step, tk=[];
    for(var t=0;t<=top;t+=step) tk.push(t);
    var PW=W-pad.l-pad.r, PH=H-pad.t-pad.b, py=function(v){ return pad.t+PH*(1-v/top); };
    gridY(ctx,W,pad,tk.map(function(v){ return {v:v,y:py(v)}; }),
          function(v){ return String(v); });
    var col=colorOf(cfg.color), slot=PW/k;
    bins.forEach(function(bin,i){
      var x=pad.l+slot*i, h=(PH*bin.n/top)*c.t;
      ctx.fillStyle=col; barV(ctx,x+0.75,pad.t+PH-h,Math.max(1,slot-1.5),h,2);
      var d=cfg.tip?cfg.tip(bin,i,bins):{title:fmt(bin.lo)+' – '+fmt(bin.hi),
        rows:[{name:str('count'),val:nf(bin.n),color:col},
              {name:str('share'),val:(Math.round(bin.n/rows.length*1000)/10)+'%'}]};
      c.hits.push({x:x,y:pad.t,w:slot,h:PH,title:d.title,rows:d.rows,note:d.note});
    });
    /* label the bin EDGES, not the bin centres: a bar spans [edge, next edge) */
    ctx.save(); ctx.fillStyle=T.muted; ctx.font='11px system-ui, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    var step=Math.max(1,Math.ceil(k/(W>560?6:3)));
    for(var e=0;e<=k;e+=step) ctx.fillText(compact(lo+width*e), pad.l+slot*e, pad.t+PH+8);
    ctx.restore();
    txt(ctx, cfg.axisNote||str('histogramBins',{k:k,w:compact(width)}),
        pad.l+PW/2, H-8, 'center', T.muted,'600',10.5);
    dropNote(ctx,W,H,rows);
  });
};

/* horizontal bars (one series): ranking and magnitude */
VIZ.hbars=function(cvs,cfg){
  var L=fld(cfg.label), V=fld(cfg.value), fmt=cfg.format||compact;
  /* cfg.key gives a row a stable identity across re-sorts. With it, play() makes a
     mark TRAVEL from the row it held to the row it now belongs in, instead of
     regrowing from zero — object constancy, ported from D3's keyed join without the
     runtime (references/external-tools.md § What was actually adopted).
     Without cfg.key nothing changes: the bar grows from zero as it always did. */
  var K=cfg.key?fld(cfg.key):null;
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(),[V]), pad={t:14,b:12};
    if(!rows.length) return;
    var labelW=Math.min(cfg.labelW||210, Math.max(96,W*(cfg.labelRatio||0.3)));
    var PW=W-labelW-(cfg.valueW||64), rowH=(H-pad.t-pad.b)/rows.length;
    /* cfg.max pins the scale for side-by-side comparison (see macro 09) */
    var mx=finiteNumber(cfg.max) || Math.max.apply(null,rows.map(function(r){return Math.abs(V(r));})) || 1;
    var prev=K&&c.__prev, moving=!!(prev&&c.t<1), snap=K?Object.create(null):null;
    ctx.font='600 11.5px system-ui, sans-serif';
    rows.forEach(function(r,i){
      var k=K?String(K(r)):null, p=(moving&&prev[k])?prev[k]:null;
      /* a row that was not on screen before has nowhere to travel from: it grows
         in place, and fades in so the arrival is not mistaken for a jump */
      var pos = p ? p.i+(i-p.i)*c.t : i;
      var val = p ? p.v+(Math.abs(V(r))-p.v)*c.t : Math.abs(V(r))*c.t;
      var alpha = (moving&&!p) ? c.t : 1;
      var cy=pad.t+rowH*pos+rowH/2, bh=Math.min(cfg.barH||18,rowH-5);
      ctx.save(); if(alpha<1) ctx.globalAlpha=alpha;
      ctx.font='600 11.5px system-ui, sans-serif';
      txt(ctx, ell(ctx,L(r),labelW-12), labelW-10, cy, 'right', T.text2,'600',11.5);
      var bw=PW*val/mx;
      ctx.fillStyle=cfg.colorOf?cfg.colorOf(r,i):colorOf(cfg.color);
      barH(ctx,labelW,cy-bh/2,Math.max(2,bw),bh,4);
      if(c.t>=1){ ctx.save(); ctx.font='650 11.5px system-ui, sans-serif';
        var lx=clampLabel(ctx,fmt(V(r)),labelW+bw+8,'left',labelW+4,W-4); ctx.restore();
        txt(ctx,fmt(V(r)),lx,cy,'left',T.text2,'650',11.5); }
      ctx.restore();
      if(snap) snap[k]={i:i, v:Math.abs(V(r))};
      var d=cfg.tip?cfg.tip(r,i,rows):{title:String(L(r)),rows:[{name:cfg.seriesName||str('value'),val:fmt(V(r))}]};
      c.hits.push({x:0,y:cy-rowH/2,w:W,h:rowH,title:d.title,rows:d.rows,note:d.note,click:cfg.onSelect&&function(){cfg.onSelect(r);}});
    });
    if(snap&&c.t>=1) c.__prev=snap;
    dropNote(ctx,W,H,rows);
  });
};

/* bullet: a value against the reference it is measured from, one row per entity.
   references/analysis-lenses.md asks for the reference to be ON THE PAGE
   whenever a difference is the claim; every other factory here leaves it to the
   prose, where it is easy to drop. The bar is a bar, so it starts at zero. The
   target is a tick across the track and not a second bar, because two bars
   invite reading the gap between them as a length of its own — which it is not.
   cfg: rows, label, value, target, format, targetLabel */
VIZ.bullet=function(cvs,cfg){
  var L=fld(cfg.label), V=fld(cfg.value), G=fld(cfg.target), fmt=cfg.format||compact;
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(),[V,G]), pad={t:24,b:28};
    if(!rows.length){ chartMessage(ctx,W,H); return; }
    if(needsNonNegative(ctx,W,H,rows,V,'VIZ.divHbars')) return;
    ctx.font='600 11.5px system-ui, sans-serif';
    var labelW=Math.min(cfg.labelW||184, Math.max(88,W*(cfg.labelRatio||0.28)));
    var valueW=finiteNumber(cfg.valueW)||92, PW=W-labelW-valueW;
    var rowH=(H-pad.t-pad.b)/rows.length, bh=Math.max(6,Math.min(15,rowH*0.44));
    var mx=0; rows.forEach(function(r){ mx=Math.max(mx,V(r),G(r)); });
    mx=(mx||1)*1.06;
    var px=function(v){ return labelW+PW*v/mx; };
    ctx.save(); ctx.strokeStyle=T.line; ctx.lineWidth=1; ctx.fillStyle=T.muted;
    ctx.font='11px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    ticks(0,mx,4).forEach(function(v){ if(v>mx) return;
      var x=Math.round(px(v))+.5;
      ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
      ctx.fillText((cfg.tickFormat||compact)(v), x, H-pad.b+7); });
    ctx.restore();
    var gl=cfg.targetLabel||str('target');
    txt(ctx, gl, labelW, 12, 'left', T.muted,'650',11);
    rows.forEach(function(r,i){
      var cy=pad.t+rowH*i+rowH/2, v=V(r), g=G(r), met=v>=g;
      /* colour says only "clears the reference or not"; the signed gap is printed
         in the tooltip too, so direction never rides on colour alone */
      var col=met?T.pos:T.neg, w=(px(v)-labelW)*c.t;
      ctx.font='600 11.5px system-ui, sans-serif';
      txt(ctx, ell(ctx,L(r),labelW-12), labelW-10, cy, 'right', T.text2,'600',11.5);
      ctx.save();
      ctx.fillStyle=rgba(col,.16); barH(ctx,labelW,cy-bh/2,PW,bh,3);
      ctx.fillStyle=col; barH(ctx,labelW,cy-bh/2,Math.max(0,w),bh,3);
      var gx=Math.round(px(g))+.5;
      ctx.strokeStyle=T.text; ctx.lineWidth=2; ctx.lineCap='butt';
      ctx.beginPath(); ctx.moveTo(gx,cy-bh/2-3); ctx.lineTo(gx,cy+bh/2+3); ctx.stroke();
      ctx.restore();
      if(c.t>=1){
        ctx.save(); ctx.font='650 11.5px system-ui, sans-serif';
        var lx=clampLabel(ctx,fmt(v),W-4,'right',labelW+4,W-4); ctx.restore();
        txt(ctx,fmt(v),lx,cy,'right',T.text2,'650',11.5);
      }
      var d=cfg.tip?cfg.tip(r,i,rows,{met:met}):{title:String(L(r)),
        rows:[{name:cfg.seriesName||str('value'),val:fmt(v),color:col},
              {name:gl,val:fmt(g)},
              {name:str('vsTarget'),val:sg(v-g)}],
        note: met?str('bulletMet'):str('bulletShort')};
      c.hits.push({x:0,y:cy-rowH/2,w:W,h:rowH,title:d.title,rows:d.rows,note:d.note});
    });
    dropNote(ctx,W,H,rows);
  });
};

/* diverging horizontal bars: left/right of zero. This chart owns its row labels. */
VIZ.divHbars=function(cvs,cfg){
  var L=fld(cfg.label), V=fld(cfg.value), fmt=cfg.format||function(v){return sg(v,'');};
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(),[V]), pad={t:16,b:22};
    if(!rows.length) return;
    /* Measure with the font you draw with. Otherwise ell() decides the label fits
       and txt() draws it wider, so it is clipped at the canvas edge. */
    ctx.font='600 12px system-ui, sans-serif';
    var labelW=Math.min(cfg.labelW||96, Math.max(56, W*(cfg.labelRatio||.28))),
        rowH=(H-pad.t-pad.b)/rows.length;
    /* cfg.max pins the scale so two charts can be compared side by side
       (macro 09 requires it). Without it each chart scales itself and the
       comparison becomes an illusion. */
    var mx=(finiteNumber(cfg.max) || Math.max.apply(null,rows.map(function(r){return Math.abs(V(r));})) || 1)*1.15;
    var cx0=labelW+(W-labelW)*.46;
    /* Reserve room so a negative value label cannot land on the row name. If this
       goes negative on a narrow canvas the bars draw backwards, hence the floor. */
    var half=Math.max(16, Math.min(cx0-labelW-56, W-cx0-52));
    ctx.save(); ctx.strokeStyle=T.lineStrong; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(Math.round(cx0)+.5,pad.t); ctx.lineTo(Math.round(cx0)+.5,H-pad.b); ctx.stroke(); ctx.restore();
    txt(ctx,'0',cx0,H-8,'center',T.muted,'500',10.5);
    rows.forEach(function(r,i){
      var cy=pad.t+rowH*i+rowH/2, bh=Math.min(18,rowH-6), v=V(r);
      ctx.font='600 12px system-ui, sans-serif';
      txt(ctx, ell(ctx,L(r),labelW-12), labelW-10, cy,'right',T.text2,'600',12);
      var bw=(half*v/mx)*c.t;
      ctx.fillStyle=v>=0?T.pos:T.neg;
      barH(ctx,cx0,cy-bh/2,bw,bh,4);
      if(c.t>=1){ ctx.save(); ctx.font='650 11.5px system-ui, sans-serif';
        var al=v>=0?'left':'right', lx=clampLabel(ctx,fmt(v),cx0+bw+(v>=0?8:-8),al,labelW+2,W-4);
        ctx.restore(); txt(ctx,fmt(v),lx,cy,al,T.text2,'650',11.5); }
      var d=cfg.tip?cfg.tip(r,i,rows):{title:String(L(r)),rows:[{name:cfg.seriesName||str('change'),val:fmt(v),cls:dirCls(v)}]};
      c.hits.push({x:0,y:cy-rowH/2,w:W,h:rowH,title:d.title,rows:d.rows,note:d.note});
    });
    dropNote(ctx,W,H,rows);
  });
};

/* small multiples: 2-3 metrics in DIFFERENT units, one axis each, same rows.
   This is the replacement for a dual axis. */
VIZ.panels=function(cvs,cfg){
  var L=fld(cfg.label);
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(), cfg.panels.map(function(p){return fld(p.get);})), top=26, bot=16;
    if(!rows.length) return;
    /* colours arrive as token names, same contract as every other factory */
    var ps=cfg.panels.map(function(p,pi){ return {title:p.title,get:fld(p.get),
      color:colorOf(p.color, T.series[pi%3]), format:p.format||compact}; });
    var labelW=Math.min(96,W*.24), gutter=Math.max(38,W*.07);
    var panelW=(W-labelW-gutter*(ps.length-1)-18)/ps.length;
    var rowH=(H-top-bot)/rows.length;
    ps.forEach(function(p,pi){
      p.x=labelW+pi*(panelW+gutter);
      /* magnitude comparison, so measure on absolute value; an all-zero or all-negative
         panel must not collapse the axis */
      p.mx=Math.max.apply(null,rows.map(function(r){ return Math.abs(p.get(r)); }))||1;
      txt(ctx,p.title,p.x,10,'left',T.text2,'650',11.5);
      txt(ctx,(cfg.maxPrefix||str('max'))+compact(p.mx),p.x+panelW,10,'right',T.muted,'500',10.5);
    });
    rows.forEach(function(r,i){
      var cy=top+rowH*i+rowH/2;
      ctx.font='600 11.5px system-ui, sans-serif';
      txt(ctx, ell(ctx,L(r),labelW-12), labelW-10, cy,'right',T.text2,'600',11.5);
      ps.forEach(function(p){
        var v=p.get(r), bh=Math.min(20,rowH-8), bw=(panelW*Math.abs(v)/p.mx)*c.t;
        ctx.fillStyle=p.color; barH(ctx,p.x,cy-bh/2,Math.max(2,bw),bh,4);
        if(c.t>=1){
          var s=p.format(v);
          ctx.save(); ctx.font='650 11px system-ui, sans-serif';
          var tw=ctx.measureText(s).width, inside=bw>tw+26;
          /* keep the label in its panel: if it will not fit inside the bar, push it out
             only as far as the panel edge */
          var lx=inside ? p.x+bw-7
                        : clampLabel(ctx,s,p.x+bw+7,'left',p.x,Math.min(p.x+panelW+gutter-6, W-4));
          ctx.restore();
          txt(ctx,s,lx,cy,inside?'right':'left',inside?T.surface:T.text2,'650',11);
        }
        var d=cfg.tip?cfg.tip(r,i,rows):{title:String(L(r)),
          rows:ps.map(function(q){ return {name:q.title,val:q.format(q.get(r)),color:q.color}; })};
        c.hits.push({x:p.x,y:cy-rowH/2,w:panelW,h:rowH,title:d.title,rows:d.rows,note:d.note});
      });
    });
  });
};

/* bubble scatter: relationship of two metrics + size (magnitude) + diverging
   colour (direction). Hit testing is nearest-point. */
VIZ.bubbles=function(cvs,cfg){
  var X=fld(cfg.x), Y=fld(cfg.y), S=fld(cfg.size), L=fld(cfg.label), C=cfg.colorValue?fld(cfg.colorValue):null;
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(),[X,Y,S]), pad={l:56,r:22,t:18,b:44};
    if(!rows.length) return;
    if(needsNonNegative(ctx,W,H,rows,function(r){ return Math.min(X(r),Y(r)); },'a chart with a signed axis')) return;
    var mX=(Math.max.apply(null,rows.map(X))||1)*1.08, mY=(Math.max.apply(null,rows.map(Y))||1)*1.12;
    var PW=W-pad.l-pad.r, PH=H-pad.t-pad.b;
    var px=function(v){ return pad.l+PW*v/mX; }, py=function(v){ return pad.t+PH*(1-v/mY); };
    var fx=cfg.tickFormatX||compact, fy=cfg.tickFormatY||compact;
    gridY(ctx,W,pad,ticks(0,mY,5).map(function(v){return {v:v,y:py(v)};}), fy);
    ctx.save(); ctx.fillStyle=T.muted; ctx.font='11px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    ticks(0,mX,5).forEach(function(v){ ctx.fillText(fx(v),px(v),pad.t+PH+8); });
    ctx.restore();
    if(cfg.identityLine){                          /* y=x reference line — only when both axes share a unit */
      var d=Math.min(mX,mY);
      ctx.save(); ctx.strokeStyle=T.lineStrong; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(px(0),py(0)); ctx.lineTo(px(d),py(d)); ctx.stroke(); ctx.restore();
      txt(ctx,cfg.identityLine,px(d)+8,py(d)+4,'left',T.muted,'600',11);
    }
    if(cfg.axisX) txt(ctx,cfg.axisX,W-pad.r,H-8,'right',T.muted,'600',11);
    if(cfg.axisY) txt(ctx,cfg.axisY,pad.l-46,pad.t-4,'left',T.muted,'600',11);
    var mS=Math.max.apply(null,rows.map(function(r){ return Math.abs(S(r)); }))||1;
    rows.slice().sort(function(a,b){ return S(b)-S(a); }).forEach(function(r){
      var rad=(4+16*Math.sqrt(S(r)/mS))*c.t, x=px(X(r)), y=py(Y(r));
      var hex=C?diverge(C(r)/(cfg.colorScale||1)):colorOf(cfg.color);
      var on=cfg.selected&&cfg.selected()===L(r);
      ctx.save(); ctx.fillStyle=hex; ctx.globalAlpha=on?.95:.72;
      ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fill();
      ctx.globalAlpha=1; ctx.strokeStyle=on?T.text:T.surface; ctx.lineWidth=2;   /* a surface-coloured ring separates overlapping marks (ink, not data) */
      ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.stroke(); ctx.restore();
      var d2=cfg.tip?cfg.tip(r):{title:String(L(r)),rows:[]};
      c.hits.push({x:x,y:y,r:Math.max(rad,12),title:d2.title,rows:d2.rows,note:d2.note,
        click:cfg.onSelect&&function(){ cfg.onSelect(r); }});
    });
    if(c.t>=1 && cfg.labelExtremes){                /* label only a few extremes directly */
      ctx.save(); ctx.font='650 11px system-ui, sans-serif';
      cfg.labelExtremes(rows).forEach(function(r){
        var rad=4+16*Math.sqrt(S(r)/mS), x=px(X(r)), y=py(Y(r)), right=x<pad.l+PW*.6;
        txt(ctx, ell(ctx,L(r),PW*.34), x+(right?rad+7:-rad-7), y, right?'left':'right', T.text2,'650',11);
      });
      ctx.restore();
    }
    dropNote(ctx,W,H,rows);
  },{repaintOnHover:true});
};

/* scatter: two measures per entity, one uniform dot each — the relationship
   WITHOUT a third measure to size it by. VIZ.bubbles anchors both axes at the
   origin and takes no domain option, so a pair living between 1,000 and 2,600
   lands in one corner as a smear; asking for a size column that the data does
   not have is the other way that lens used to fail. This one takes its domain
   from the data and pads it. Nothing here encodes length — a dot is a position,
   not a magnitude — so a non-zero axis is honest, and the zero-baseline rule
   that binds every bar does not bind this.
   cfg: rows, label, x, y, format, identityLine, axisX, axisY, zeroBased */
VIZ.scatter=function(cvs,cfg){
  var X=fld(cfg.x), Y=fld(cfg.y), L=fld(cfg.label), fmt=cfg.format||compact;
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(),[X,Y]), pad={l:56,r:22,t:18,b:cfg.axisX?46:34};
    if(rows.length<2){ chartMessage(ctx,W,H,str('scatterMin')); return; }
    var xs=rows.map(X), ys=rows.map(Y);
    var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
    var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
    /* one distinct value has no span to scale by; give the axis a width instead
       of dividing by zero and painting every dot at NaN */
    var sx=(x1-x0)||Math.abs(x1)||1, sy=(y1-y0)||Math.abs(y1)||1;
    x0-=sx*0.08; x1+=sx*0.08; y0-=sy*0.08; y1+=sy*0.08;
    if(cfg.zeroBased){ x0=Math.min(x0,0); y0=Math.min(y0,0); }
    var PW=W-pad.l-pad.r, PH=H-pad.t-pad.b;
    var px=function(v){ return pad.l+PW*(v-x0)/(x1-x0); },
        py=function(v){ return pad.t+PH*(1-(v-y0)/(y1-y0)); };
    var fx=cfg.tickFormatX||compact, fy=cfg.tickFormatY||compact;
    gridY(ctx,W,pad,ticks(y0,y1,5).filter(function(v){ return v>=y0&&v<=y1; })
      .map(function(v){ return {v:v,y:py(v)}; }), fy);
    ctx.save(); ctx.fillStyle=T.muted; ctx.font='11px system-ui, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ticks(x0,x1,5).forEach(function(v){ if(v<x0||v>x1) return;
      ctx.fillText(fx(v),px(v),pad.t+PH+8); });
    ctx.restore();
    if(cfg.identityLine){       /* y=x — meaningful only when both axes share a unit */
      var a=Math.max(x0,y0), b=Math.min(x1,y1);
      if(b>a){
        ctx.save(); ctx.strokeStyle=T.lineStrong; ctx.lineWidth=1; ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(px(a),py(a)); ctx.lineTo(px(b),py(b)); ctx.stroke(); ctx.restore();
        ctx.font='600 10.5px system-ui, sans-serif';
        txt(ctx,ell(ctx,cfg.identityLine,PW*.4),px(b)-6,py(b)-10,'right',T.muted,'600',10.5);
      }
    }
    if(cfg.axisX) txt(ctx,cfg.axisX,pad.l+PW/2,H-8,'center',T.muted,'600',11);
    if(cfg.axisY) txt(ctx,cfg.axisY,pad.l-46,pad.t-7,'left',T.muted,'600',11);
    /* a reveal: dots appear in row order and every dot drawn is already at its
       true position, so no intermediate frame misstates a value */
    var col=colorOf(cfg.color), n=Math.max(1,Math.round(rows.length*c.t));
    for(var i=0;i<n;i++){
      var r=rows[i], x=px(X(r)), y=py(Y(r));
      ctx.save(); ctx.fillStyle=col; ctx.globalAlpha=.72;
      ctx.beginPath(); ctx.arc(x,y,4.5,0,7); ctx.fill();
      ctx.globalAlpha=1; ctx.strokeStyle=T.surface; ctx.lineWidth=1.5;   /* ink, not data: separates overlapping marks */
      ctx.beginPath(); ctx.arc(x,y,4.5,0,7); ctx.stroke(); ctx.restore();
      var d=cfg.tip?cfg.tip(r,i,rows):{title:String(L(r)),
        rows:[{name:cfg.axisX||str('value'),val:fmt(X(r)),color:col},
              {name:cfg.axisY||str('value'),val:fmt(Y(r))}]};
      c.hits.push({x:x,y:y,r:9,title:d.title,rows:d.rows,note:d.note});
    }
    dropNote(ctx,W,H,rows);
  });
};

/* donut: 2-5 nominal parts. All-zero input degrades to an empty ring. */
VIZ.donut=function(cvs,cfg){
  var L=fld(cfg.label), V=fld(cfg.value), fmt=cfg.format||nf;
  return mk(cvs,function(ctx,W,H,c){
    var rows=typeof cfg.rows==='function'?cfg.rows():cfg.rows||[], clean=[], invalid=false;
    if(rows.length<2){ chartMessage(ctx,W,H,str('donutMin')); return; }
    if(rows.length>5){ chartMessage(ctx,W,H,str('donutMax')); return; }
    rows.forEach(function(r,i){ var v=finiteNumber(V(r)); if(v==null||v<0) invalid=true;
      clean.push({row:r,i:i,value:v}); });
    if(invalid){ chartMessage(ctx,W,H,str('donutSign')); return; }
    var total=clean.reduce(function(sum,d){ return sum+d.value; },0), cx=W/2, cy=H/2;
    var outer=Math.max(24,Math.min(W,H)*.34), inner=outer*.58, start=-Math.PI/2;
    ctx.save(); ctx.strokeStyle=T.surface2; ctx.lineWidth=outer-inner; ctx.beginPath(); ctx.arc(cx,cy,(outer+inner)/2,0,Math.PI*2); ctx.stroke(); ctx.restore();
    if(!total){ txt(ctx,cfg.centerLabel||'—',cx,cy,'center',T.muted,'680',13); return; }
    clean.forEach(function(d,i){
      var sweep=Math.PI*2*d.value/total, end=start+sweep*c.t, col=colorOf(d.row.color,cfg.color||T.series[i%3]);
      if(end>start){ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=outer-inner; ctx.lineCap='butt';
        ctx.beginPath(); ctx.arc(cx,cy,(outer+inner)/2,start,end); ctx.stroke(); ctx.restore(); }
      var a0=start, a1=start+sweep, tip=cfg.tip?cfg.tip(d.row,d.i,rows):{title:String(L(d.row)),
        rows:[{name:cfg.seriesName||str('value'),val:fmt(d.value),color:col}],note:fmt(d.value/total*100)+'%'};
      c.hits.push({title:tip.title,rows:tip.rows,note:tip.note,test:(function(from,to,base){
        return function(p){ var dx=p.x-cx,dy=p.y-cy,rad=Math.sqrt(dx*dx+dy*dy),a=Math.atan2(dy,dx);
          if(a<base) a+=Math.PI*2; return rad>=inner-8&&rad<=outer+8&&a>=from&&a<=to; };
      })(a0,a1,-Math.PI/2)});
      start=a1;
    });
    txt(ctx,cfg.centerLabel||fmt(total),cx,cy-4,'center',T.text,'680',15);
    txt(ctx,cfg.centerLabel?'':(cfg.centerNote||str('total')),cx,cy+14,'center',T.muted,'600',10.5);
  });
};

/* heatmap: one hue, sequential intensity, across an x/y category grid. */
VIZ.heatmap=function(cvs,cfg){
  var X=fld(cfg.x), Y=fld(cfg.y), V=fld(cfg.value), fmt=cfg.format||nf;
  return mk(cvs,function(ctx,W,H,c){
    var rows=typeof cfg.rows==='function'?cfg.rows():cfg.rows||[], xs=[], ys=[], seenX=Object.create(null),
        seenY=Object.create(null), cells=Object.create(null), invalid=false;
    if(!rows.length){ chartMessage(ctx,W,H); return; }
    if(rows.length>100){ chartMessage(ctx,W,H,str('heatmapMax')); return; }
    rows.forEach(function(r){ var x=String(X(r)),y=String(Y(r)),v=finiteNumber(V(r)),key=x+'\u0000'+y;
      if(v==null||v<0||cells[key]) invalid=true; cells[key]=1;
      if(!seenX[x]){seenX[x]=1;xs.push(x);} if(!seenY[y]){seenY[y]=1;ys.push(y);} });
    if(invalid){ chartMessage(ctx,W,H,str('heatmapCell')); return; }
    if(!xs.length||!ys.length){ chartMessage(ctx,W,H); return; }
    var vals=rows.map(function(r){return finiteNumber(V(r));}), lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
    var labelW=Math.min(110,Math.max(52,W*.22)), top=28, bottom=18, PW=W-labelW-10, PH=H-top-bottom;
    var cw=PW/xs.length, ch=PH/ys.length, base=colorOf(cfg.color,T.s1);
    ctx.save(); ctx.font='600 10.5px system-ui, sans-serif';
    xs.forEach(function(x,i){ txt(ctx,ell(ctx,x,cw-4),labelW+cw*(i+.5),top-12,'center',T.muted,'600',10.5); });
    ys.forEach(function(y,i){ txt(ctx,ell(ctx,y,labelW-10),labelW-8,top+ch*(i+.5),'right',T.text2,'600',10.5); });
    ctx.restore();
    rows.forEach(function(r,i){
      var xi=xs.indexOf(String(X(r))), yi=ys.indexOf(String(Y(r))), v=finiteNumber(V(r));
      var q=hi===lo?(v===0?0:.75):(v-lo)/(hi-lo), intensity=Math.max(.08,Math.min(1,q*c.t));
      var col=mix(T.surface,base,intensity), x=labelW+xi*cw+1, y=top+yi*ch+1;
      ctx.fillStyle=col; ctx.fillRect(x,y,Math.max(0,cw-2),Math.max(0,ch-2));
      if(cw>42&&ch>25&&c.t>=1) txt(ctx,fmt(v),x+cw/2-1,y+ch/2,'center',q>.55?T.surface:T.text2,'650',10.5);
      var tip=cfg.tip?cfg.tip(r,i,rows):{title:String(Y(r))+' · '+String(X(r)),rows:[{name:cfg.seriesName||str('value'),val:fmt(v),color:col}]};
      c.hits.push({x:x,y:y,w:Math.max(0,cw-2),h:Math.max(0,ch-2),title:tip.title,rows:tip.rows,note:tip.note});
    });
  });
};

/* slope: two points in time joined by a line, read as rank/value movement. */
VIZ.slope=function(cvs,cfg){
  var L=fld(cfg.label), A=fld(cfg.before), B=fld(cfg.after), fmt=cfg.format||nf;
  return mk(cvs,function(ctx,W,H,c){
    var rows=typeof cfg.rows==='function'?cfg.rows():cfg.rows||[];
    if(!rows.length){ chartMessage(ctx,W,H); return; }
    if(rows.length>12){ chartMessage(ctx,W,H,str('slopeMax')); return; }
    var vals=rows.map(function(r){return [finiteNumber(A(r)),finiteNumber(B(r))];}), lo=Infinity,hi=-Infinity;
    if(vals.some(function(v){return v[0]==null||v[1]==null;})){
      chartMessage(ctx,W,H,str('slopeNeedsEnds')); return;
    }
    vals.forEach(function(v){lo=Math.min(lo,v[0],v[1]);hi=Math.max(hi,v[0],v[1]);}); if(lo===hi){lo-=1;hi+=1;}
    var pad={l:64,r:64,t:28,b:18}, left=pad.l,right=W-pad.r, PH=H-pad.t-pad.b;
    var py=function(v){return pad.t+PH*(1-(v-lo)/(hi-lo));};
    var names=cfg.labels||{}, before=Array.isArray(names)?names[0]:(names.before||cfg.beforeLabel||'Before'),
        after=Array.isArray(names)?names[1]:(names.after||cfg.afterLabel||'After');
    txt(ctx,before,left,13,'center',T.muted,'650',11); txt(ctx,after,right,13,'center',T.muted,'650',11);
    rows.forEach(function(r,i){
      var a=vals[i][0],b=vals[i][1], y1=py(a),y2=py(b), endX=left+(right-left)*c.t, endY=y1+(y2-y1)*c.t;
      var col=colorOf(r.color,cfg.color||T.series[i%3]);
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath();ctx.moveTo(left,y1);ctx.lineTo(endX,endY);ctx.stroke();
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(left,y1,3.5,0,7);ctx.fill();
      if(c.t>.92){ctx.beginPath();ctx.arc(right,y2,3.5,0,7);ctx.fill();}ctx.restore();
      /* Measure with the font you draw with, or ell() decides the label fits and
         txt() draws it wider — clipped at the canvas edge. Same trap as divHbars. */
      if(c.t>=1){ ctx.font='600 10.5px system-ui, sans-serif';
        txt(ctx,ell(ctx,L(r),pad.l-8),left-8,y1,'right',T.text2,'600',10.5); txt(ctx,fmt(b),right+8,y2,'left',T.text2,'650',10.5); }
      var tip=cfg.tip?cfg.tip(r,i,rows):{title:String(L(r)),rows:[{name:before,val:fmt(a),color:col},{name:after,val:fmt(b),color:col}]};
      c.hits.push({x:left,y:y1,r:5,title:tip.title,rows:tip.rows,note:tip.note});
      c.hits.push({x:right,y:y2,r:5,title:tip.title,rows:tip.rows,note:tip.note});
    });
  });
};

/* dumbbell: the two levels AND the distance between them, one row per entity.
   VIZ.slope answers "who overtook whom" and caps at 12 because crossing lines
   stop being readable past that; VIZ.divHbars shows the delta and throws the
   levels away. Neither answers "where did each one start, where did it end, and
   how far is that" — the question when nothing crosses, which is most of the
   time. The start dot is muted and the end dot carries the direction colour, so
   the eye reads the travel rather than the pair.
   cfg: rows, label, before, after, format, beforeLabel, afterLabel */
VIZ.dumbbell=function(cvs,cfg){
  var L=fld(cfg.label), A=fld(cfg.before), B=fld(cfg.after), fmt=cfg.format||compact;
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(),[A,B]), pad={t:26,b:30};
    if(!rows.length){ chartMessage(ctx,W,H,str('dumbbellEnds')); return; }
    ctx.font='600 11.5px system-ui, sans-serif';
    var labelW=Math.min(cfg.labelW||190, Math.max(90,W*(cfg.labelRatio||0.28)));
    var valueW=finiteNumber(cfg.valueW)||88, PW=W-labelW-valueW;
    var rowH=(H-pad.t-pad.b)/rows.length;
    var lo=Infinity, hi=-Infinity;
    rows.forEach(function(r){ lo=Math.min(lo,A(r),B(r)); hi=Math.max(hi,A(r),B(r)); });
    var span=(hi-lo)||Math.abs(hi)||1; lo-=span*0.08; hi+=span*0.08;
    var px=function(v){ return labelW+PW*(v-lo)/(hi-lo); };
    ctx.save(); ctx.strokeStyle=T.line; ctx.lineWidth=1; ctx.fillStyle=T.muted;
    ctx.font='11px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    ticks(lo,hi,4).forEach(function(v){ if(v<lo||v>hi) return;
      var x=Math.round(px(v))+.5;
      ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
      ctx.fillText((cfg.tickFormat||compact)(v), x, H-pad.b+7); });
    ctx.restore();
    var before=cfg.beforeLabel||str('before'), after=cfg.afterLabel||str('after');
    txt(ctx,before+' → '+after,labelW,13,'left',T.muted,'650',11);
    rows.forEach(function(r,i){
      var cy=pad.t+rowH*i+rowH/2, a=A(r), b=B(r);
      var col=b>=a?T.pos:T.neg, xa=px(a), xb=xa+(px(b)-xa)*c.t;
      ctx.font='600 11.5px system-ui, sans-serif';
      txt(ctx, ell(ctx,L(r),labelW-12), labelW-10, cy, 'right', T.text2,'600',11.5);
      ctx.save();
      ctx.strokeStyle=rgba(col,.42); ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(xa,cy); ctx.lineTo(xb,cy); ctx.stroke();
      ctx.fillStyle=T.muted; ctx.beginPath(); ctx.arc(xa,cy,4,0,7); ctx.fill();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(xb,cy,5,0,7); ctx.fill();
      ctx.restore();
      /* Measure with the font you draw with — same trap as slope and divHbars. */
      if(c.t>=1){
        ctx.save(); ctx.font='650 11.5px system-ui, sans-serif';
        var lx=clampLabel(ctx,fmt(b),W-4,'right',labelW+4,W-4); ctx.restore();
        txt(ctx,fmt(b),lx,cy,'right',T.text2,'650',11.5);
      }
      var d=cfg.tip?cfg.tip(r,i,rows):{title:String(L(r)),
        rows:[{name:before,val:fmt(a)},{name:after,val:fmt(b),color:col},
              {name:str('change'),val:sg(b-a)}]};
      c.hits.push({x:0,y:cy-rowH/2,w:W,h:rowH,title:d.title,rows:d.rows,note:d.note});
    });
    dropNote(ctx,W,H,rows);
  });
};

/* lollipop: ranking, drawn as a stem from the baseline to the value. */
VIZ.lollipop=function(cvs,cfg){
  var L=fld(cfg.label), V=fld(cfg.value), fmt=cfg.format||compact;
  var K=cfg.key?fld(cfg.key):null;      /* keyed re-sort — see VIZ.hbars */
  return mk(cvs,function(ctx,W,H,c){
    var rows=typeof cfg.rows==='function'?cfg.rows():cfg.rows||[];
    if(!rows.length){ chartMessage(ctx,W,H); return; }
    if(rows.length>20){ chartMessage(ctx,W,H,str('lollipopMax')); return; }
    /* valueW is the room reserved on the right for the value label. Open it to cfg the
       way hbars does — 58 is not enough for a currency string like '₩39,018'. */
    var pad={t:14,b:12}, labelW=Math.min(cfg.labelW||170,Math.max(82,W*.28)),
        valueW=finiteNumber(cfg.valueW)||58;
    var PW=W-labelW-valueW, rowH=(H-pad.t-pad.b)/rows.length, vals=rows.map(function(r){return finiteNumber(V(r));});
    if(vals.some(function(v){return v==null;})){ chartMessage(ctx,W,H,str('needsNumbers')); return; }
    var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), maxP=Math.max(0,max)||1, maxN=Math.abs(Math.min(0,min))||1;
    var zero=labelW+(min<0?PW*maxN/(maxN+maxP):0);
    ctx.save();ctx.strokeStyle=T.line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(Math.round(zero)+.5,pad.t);ctx.lineTo(Math.round(zero)+.5,H-pad.b);ctx.stroke();ctx.restore();
    var prev=K&&c.__prev, moving=!!(prev&&c.t<1), snap=K?Object.create(null):null;
    rows.forEach(function(r,i){
      var k=K?String(K(r)):null, p=(moving&&prev[k])?prev[k]:null;
      var pos = p ? p.i+(i-p.i)*c.t : i;
      var v=vals[i], vv = p ? p.v+(v-p.v)*c.t : v;
      var alpha = (moving&&!p) ? c.t : 1;
      var cy=pad.t+rowH*(pos+.5), fullX=vv<0?zero+(labelW-zero)*Math.abs(vv)/maxN:zero+(W-valueW-zero)*vv/maxP;
      /* with a key the dot slides between rows and between values; without one it
         still sweeps out from zero exactly as before */
      var x=p?fullX:zero+(fullX-zero)*c.t, col=colorOf(r.color,cfg.color||(v<0?T.neg:T.s1));
      if(snap) snap[k]={i:i, v:v};
      if(alpha<1){ ctx.save(); ctx.globalAlpha=alpha; }
      /* ell() measures with whatever font is currently set. If that differs from the one
         txt() draws with, a label it judged to fit is drawn wider and runs off the left
         edge — a hard clip with no ellipsis. Set the drawing font immediately before
         measuring, on every row (same treatment as hbars, divHbars and panels). */
      ctx.font='600 11px system-ui, sans-serif';
      txt(ctx,ell(ctx,L(r),labelW-10),labelW-8,cy,'right',T.text2,'600',11);
      ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(zero,cy);ctx.lineTo(x,cy);ctx.stroke();
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,cy,Math.min(6,Math.max(3,rowH*.24)),0,7);ctx.fill();ctx.restore();
      if(c.t>=1){                       /* keep the value label inside the plot (as hbars does) */
        ctx.save(); ctx.font='650 11px system-ui, sans-serif';
        var al=v>=0?'left':'right';
        var lx=clampLabel(ctx,fmt(v),x+(v>=0?8:-8),al,2,W-2); ctx.restore();
        txt(ctx,fmt(v),lx,cy,al,T.text2,'650',11);
      }
      if(alpha<1) ctx.restore();
      var tip=cfg.tip?cfg.tip(r,i,rows):{title:String(L(r)),rows:[{name:cfg.seriesName||str('value'),val:fmt(v),color:col}]};
      c.hits.push({x:0,y:cy-rowH/2,w:W,h:rowH,title:tip.title,rows:tip.rows,note:tip.note});
    });
    if(snap&&c.t>=1) c.__prev=snap;
  });
};

/* waterfall (bridge): opening -> components -> closing. Bars diverge from zero. */
VIZ.waterfall=function(cvs,cfg){
  var fmt=cfg.format||function(v){ return sg(v,''); };
  var c=mk(cvs,function(ctx,W,H,ch){
    var steps=usable(cfg.steps(),[function(x){return x.value;}]), pad={l:64,r:20,t:44,b:56};
    if(!steps.length) return;
    var PW=W-pad.l-pad.r, PH=H-pad.t-pad.b;
    var mxv=Math.max.apply(null,steps.map(function(s){return Math.abs(s.value);}))||1;
    var lo=-mxv*1.35, hi=mxv*1.35;                 /* the axis range comes from the DATA, never back-computed from the ticks */
    var py=function(v){ return pad.t+PH*(1-(v-lo)/(hi-lo)); };
    gridY(ctx,W,pad,ticks(lo,hi,6).filter(function(v){return v>=lo&&v<=hi;}).map(function(v){return {v:v,y:py(v)};}),
      function(v){ return (v>0?'+':'')+compact(v); });
    var y0=Math.round(py(0))+.5;
    ctx.save(); ctx.strokeStyle=T.lineStrong; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad.l,y0); ctx.lineTo(W-pad.r,y0); ctx.stroke(); ctx.restore();
    var slot=PW/steps.length, bw=Math.min(46,slot*.44);
    steps.forEach(function(s,i){
      var appear=Math.max(0,Math.min(1,ch.t*steps.length-i)), cx=pad.l+slot*i+slot/2;
      var v=s.value*appear, h=py(0)-py(v);
      if(appear>0 && Math.abs(h)<2) h=(s.value>0?2:-2);
      ctx.fillStyle=s.total?rgba(T.text,.55):(s.value>0?T.pos:T.neg);
      barV(ctx,cx-bw/2,py(0)-h,bw,h,4);
      if(appear>.6){
        var ly=Math.max(pad.t+10,Math.min(pad.t+PH-10, py(s.value)+(s.value>0?-14:16)));
        txt(ctx,fmt(s.value),cx,ly,'center',T.text,'680',12.5);
      }
      ctx.save(); ctx.fillStyle=T.text2; ctx.font='600 11.5px system-ui, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText(ell(ctx,s.name,slot-6),cx,pad.t+PH+10);
      if(s.sub){ ctx.fillStyle=T.muted; ctx.font='11px system-ui, sans-serif'; ctx.fillText(s.sub,cx,pad.t+PH+26); }
      ctx.restore();
      var d=cfg.tip?cfg.tip(s):{title:s.name,rows:[{name:cfg.seriesName||str('delta'),val:fmt(s.value),cls:dirCls(s.value)}]};
      ch.hits.push({x:cx-slot/2,y:pad.t,w:slot,h:PH,title:d.title,rows:d.rows,note:d.note});
    });
    if(cfg.startLabel) txt(ctx,cfg.startLabel,pad.l,18,'left',T.muted,'600',12);
    if(cfg.endLabel)   txt(ctx,cfg.endLabel,W-pad.r,18,'right',T.muted,'600',12);
  });
  /* __played lets a verifier ask whether this chart ever animated on its own,
     however it was wired. See assets/check-motion.py. */
  c.play=function(dur,easingName){ c.__played=true; anim(c,dur||800,null,easingName); return c; };
  return c;
};

/* sparkline: a 12-25 point trend inside a stat tile */
/* In a small-multiple grid (macro 06) every cell MUST share one axis, so pass
   cfg.min / cfg.max to pin the range. Omit them and each cell scales itself. */
VIZ.spark=function(cvs,cfg){
  return mk(cvs,function(ctx,W,H){
    var v=cfg.values().map(fin).filter(function(x){ return x!==null; }), c2=colorOf(cfg.color);
    if(!v.length) return;
    if(v.length===1) v=[v[0],v[0]];        /* one point cannot make a line — this used to divide by zero */
    var mn=(cfg.min!=null)?cfg.min:Math.min.apply(null,v),
        mx=(cfg.max!=null)?cfg.max:Math.max.apply(null,v), sp=(mx-mn)||1;
    ctx.strokeStyle=rgba(c2,.45); ctx.lineWidth=2; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath();
    v.forEach(function(y,i){ var X=2+(W-4)*i/(v.length-1), Y=H-3-(H-6)*(y-mn)/sp; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.stroke();
    var lx=W-5, ly=H-3-(H-6)*(v[v.length-1]-mn)/sp;
    ctx.fillStyle=T.surface; ctx.beginPath(); ctx.arc(lx,ly,5,0,7); ctx.fill();
    ctx.fillStyle=c2; ctx.beginPath(); ctx.arc(lx,ly,3.5,0,7); ctx.fill();
  });
};

/* box plot: compare the SHAPE of a distribution across groups. A histogram
   (divColumns) shows one distribution well; this shows twenty, comparably.
   Horizontal, so long category labels behave like hbars.
   cfg: rows, label, values(row)->number[]  |  or q1/med/q3/lo/hi accessors */
VIZ.boxplot=function(cvs,cfg){
  var L=fld(cfg.label), VALS=cfg.values?fld(cfg.values):null, fmt=cfg.format||compact;
  function quart(a){
    a=a.map(finiteNumber).filter(function(v){return v!==null;}).sort(function(x,y){return x-y;});
    if(!a.length) return null;
    function q(p){ var i=(a.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
      return a[lo]+(a[hi]-a[lo])*(i-lo); }
    var q1=q(.25), med=q(.5), q3=q(.75), iqr=q3-q1;
    var loF=q1-1.5*iqr, hiF=q3+1.5*iqr, inl=a.filter(function(v){return v>=loF&&v<=hiF;});
    return {q1:q1, med:med, q3:q3, n:a.length,
            lo:inl.length?inl[0]:a[0], hi:inl.length?inl[inl.length-1]:a[a.length-1],
            out:a.filter(function(v){return v<loF||v>hiF;})};
  }
  return mk(cvs,function(ctx,W,H,c){
    var raw=cfg.rows();
    if(!raw.length){ chartMessage(ctx,W,H); return; }
    var stats=[], drop=0;
    raw.forEach(function(r){
      var st = VALS ? quart(VALS(r)||[]) : {q1:+fld(cfg.q1)(r), med:+fld(cfg.med)(r), q3:+fld(cfg.q3)(r),
                                           lo:+fld(cfg.lo)(r), hi:+fld(cfg.hi)(r), out:[], n:null};
      if(!st || [st.lo,st.q1,st.med,st.q3,st.hi].some(function(v){return !isFinite(v);})){ drop++; return; }
      st.row=r; stats.push(st);
    });
    if(!stats.length){ chartMessage(ctx,W,H); return; }
    ctx.font='600 11.5px system-ui, sans-serif';
    var labelW=Math.min(cfg.labelW||190, Math.max(90, W*(cfg.labelRatio||0.3)));
    var pad={t:16,b:26,r:16};
    var PW=W-labelW-pad.r, rowH=(H-pad.t-pad.b)/stats.length;
    var lo=Math.min.apply(null,stats.map(function(s){ return Math.min(s.lo, s.out.length?Math.min.apply(null,s.out):s.lo); }));
    var hi=Math.max.apply(null,stats.map(function(s){ return Math.max(s.hi, s.out.length?Math.max.apply(null,s.out):s.hi); }));
    if(cfg.zeroBased) lo=Math.min(0,lo);
    var span=(hi-lo)||1; lo-=span*0.04; hi+=span*0.04;
    var px=function(v){ return labelW+PW*(v-lo)/(hi-lo); };
    /* vertical grid + x labels */
    ctx.save(); ctx.strokeStyle=T.line; ctx.lineWidth=1; ctx.fillStyle=T.muted;
    ctx.font='11px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    ticks(lo,hi,4).forEach(function(v){
      if(v<lo||v>hi) return;
      var x=Math.round(px(v))+.5;
      ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
      ctx.fillText((cfg.tickFormat||compact)(v), x, H-pad.b+7);
    });
    ctx.restore();
    var col=colorOf(cfg.color);
    stats.forEach(function(st,i){
      var cy=pad.t+rowH*i+rowH/2, bh=Math.min(cfg.boxH||16, rowH-8);
      ctx.font='600 11.5px system-ui, sans-serif';
      txt(ctx, ell(ctx,L(st.row),labelW-12), labelW-10, cy, 'right', T.text2,'600',11.5);
      var k=c.t, mid=px(st.med);
      var x1=mid+(px(st.lo)-mid)*k, x2=mid+(px(st.hi)-mid)*k;
      var b1=mid+(px(st.q1)-mid)*k, b2=mid+(px(st.q3)-mid)*k;
      ctx.save();
      ctx.strokeStyle=T.lineStrong; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x1,cy); ctx.lineTo(x2,cy); ctx.stroke();          /* whiskers */
      [x1,x2].forEach(function(x){ ctx.beginPath();
        ctx.moveTo(Math.round(x)+.5,cy-bh/3); ctx.lineTo(Math.round(x)+.5,cy+bh/3); ctx.stroke(); });
      ctx.fillStyle=rgba(col,.30); ctx.fillRect(b1,cy-bh/2,Math.max(1,b2-b1),bh);   /* box */
      ctx.strokeStyle=col; ctx.strokeRect(Math.round(b1)+.5,Math.round(cy-bh/2)+.5,Math.max(1,b2-b1),bh);
      ctx.strokeStyle=T.text; ctx.lineWidth=2;                                       /* median */
      ctx.beginPath(); ctx.moveTo(Math.round(mid)+.5,cy-bh/2); ctx.lineTo(Math.round(mid)+.5,cy+bh/2); ctx.stroke();
      ctx.restore();
      if(c.t>=1) st.out.forEach(function(v){                                         /* outliers, kept visible */
        ctx.save(); ctx.fillStyle=T.surface; ctx.beginPath(); ctx.arc(px(v),cy,3.4,0,7); ctx.fill();
        ctx.fillStyle=rgba(col,.85); ctx.beginPath(); ctx.arc(px(v),cy,2.4,0,7); ctx.fill(); ctx.restore(); });
      var d=cfg.tip?cfg.tip(st.row,st,i):{title:String(L(st.row)), rows:[
        {name:'max', val:fmt(st.hi)}, {name:'q3', val:fmt(st.q3)},
        {name:'median', val:fmt(st.med)}, {name:'q1', val:fmt(st.q1)},
        {name:'min', val:fmt(st.lo)}].concat(
        st.n!=null?[{name:'n', val:nf(st.n)}]:[]).concat(
        st.out.length?[{name:'outliers', val:nf(st.out.length)}]:[])};
      c.hits.push({x:0,y:cy-rowH/2,w:W,h:rowH,title:d.title,rows:d.rows,note:d.note});
    });
    if(drop) txt(ctx, str('rowsOmitted',{n:drop}), W-6, H-6, 'right', T.muted,'600',10.5);
  });
};

/* stacked area: composition over time, where the TOTAL is the point.
   Honest caveat, printed by the factory: only the bottom band and the total
   have a flat baseline. Middle bands cannot be compared by eye — if a middle
   band is the subject, use VIZ.panels or a separate chart. */
VIZ.stackedArea=function(cvs,cfg){
  var X=fld(cfg.x), ser=cfg.series.map(function(sr){ return {name:sr.name,get:fld(sr.get),color:sr.color}; });
  return mk(cvs,function(ctx,W,H,c){
    ser.forEach(function(sr,i){ sr.hex=colorOf(sr.color, T.series[i%3]); });
    var rows=usable(cfg.rows(), ser.map(function(sr){return sr.get;}));
    if(rows.length<2){ chartMessage(ctx,W,H); return; }
    if(needsNonNegative(ctx,W,H,rows,function(r){
      return Math.min.apply(null, ser.map(function(sr){return sr.get(r);})); },'VIZ.columns or VIZ.panels')) return;
    var pad={l:58,r:16,t:16,b:26}, PW=W-pad.l-pad.r, PH=H-pad.t-pad.b;
    var totals=rows.map(function(r){ return ser.reduce(function(a,sr){ return a+sr.get(r); },0); });
    var mx=Math.max.apply(null,totals)||1;
    var tk=ticks(0,mx*1.06,4), hi=Math.max(tk[tk.length-1]||0, mx*1.04, 1e-9);
    var px=function(i){ return pad.l+PW*i/(rows.length-1); };
    var py=function(v){ return pad.t+PH*(1-v/hi); };
    gridY(ctx,W,pad,tk.map(function(v){return {v:v,y:py(v)};}), cfg.tickFormat||compact);
    var base=rows.map(function(){ return 0; });
    ser.forEach(function(sr){
      var top=rows.map(function(r,i){ return base[i]+sr.get(r)*c.t; });
      ctx.save(); ctx.beginPath();
      rows.forEach(function(r,i){ var x=px(i), y=py(top[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      for(var i=rows.length-1;i>=0;i--) ctx.lineTo(px(i),py(base[i]));

      ctx.strokeStyle=sr.hex; ctx.lineWidth=1.25; ctx.beginPath();
      rows.forEach(function(r,i){ var x=px(i), y=py(top[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });

    });

    ctx.textBaseline='top'; ctx.textAlign='center';
    var step=Math.max(1,Math.ceil(rows.length/(W>560?6:3))), last=-1e9;
    rows.forEach(function(r,i){ if(i%step) return;

    ctx.restore();
    rows.forEach(function(r,i){
      var d=cfg.tip?cfg.tip(r,i,rows):{title:String(X(r)),
        rows:ser.map(function(sr){ return {name:sr.name,val:(cfg.format||nf)(sr.get(r)),color:sr.hex}; })
             .concat([{name:str('total'),val:(cfg.format||nf)(totals[i])}])};
      c.hits.push({x:px(i)-PW/rows.length/2,y:pad.t,w:PW/rows.length,h:PH,

/* concentration curve: "how much of the total comes from how few".
   Entities are sorted by value DESCENDING, so the curve reads top-down —
   "the top 10% hold 62%" — which is the sentence reports actually write.
   The textbook Lorenz curve is this mirrored (ascending, bowing below the
   diagonal); the area between curve and diagonal is the same either way.
   Gini is deliberately not computed: one number for a whole shape invites
   a comparison between populations that the number cannot support.
   cfg: rows, value, label, marks (percentages to call out, default [10,20,50]) */
VIZ.concentration=function(cvs,cfg){
  var V=fld(cfg.value), L=cfg.label?fld(cfg.label):null, fmt=cfg.format||compact;
  var MARKS=cfg.marks||[10,20,50];
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(),[V]).slice(), pad={l:52,r:18,t:18,b:34};
    if(rows.length<2){ chartMessage(ctx,W,H,str('concentrationMin')); return; }
    if(needsNonNegative(ctx,W,H,rows,V,'VIZ.divHbars')) return;
    rows.sort(function(a,b){ return V(b)-V(a); });
    var total=rows.reduce(function(a,r){ return a+V(r); },0);
    if(!(total>0)){ chartMessage(ctx,W,H,str('concentrationSum')); return; }
    var n=rows.length, PW=W-pad.l-pad.r, PH=H-pad.t-pad.b;
    var px=function(p){ return pad.l+PW*p/100; }, py=function(p){ return pad.t+PH*(1-p/100); };

    ctx.beginPath(); ctx.moveTo(px(0),py(0)); ctx.lineTo(px(100),py(100)); ctx.stroke(); ctx.restore();
    txt(ctx,str('concentrationEven'),px(100)-4,py(100)+13,'right',T.muted,'600',10.5);
    var col=colorOf(cfg.color,T.s1), k=Math.max(1,Math.round(pts.length*c.t));
    ctx.save(); ctx.beginPath();
    for(var j=0;j<k;j++){ var q=pts[j]; j?ctx.lineTo(px(q.x),py(q.y)):ctx.moveTo(px(q.x),py(q.y)); }
    ctx.lineTo(px(pts[k-1].x),py(0)); ctx.lineTo(px(0),py(0)); ctx.closePath();
    ctx.fillStyle=rgba(col,.13); ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.beginPath();
    for(var m=0;m<k;m++){ var q2=pts[m]; m?ctx.lineTo(px(q2.x),py(q2.y)):ctx.moveTo(px(q2.x),py(q2.y)); }
    ctx.stroke(); ctx.restore();

    ctx.save(); ctx.fillStyle=T.muted; ctx.font='11px system-ui, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    [0,25,50,75,100].forEach(function(v){ ctx.fillText(v+'%',px(v),pad.t+PH+8); });
    ctx.restore();
    txt(ctx,str('concentrationX'),pad.l+PW/2,H-8,'center',T.muted,'600',10.5);
    /* called-out points: "top k% -> y% of the total" */
    if(c.t>=1) MARKS.forEach(function(mk2){
      if(mk2<=0||mk2>=100) return;
      var idx=Math.max(1,Math.round(n*mk2/100)), share=0;
      for(var q=0;q<idx;q++) share+=V(rows[q]);

      ctx.beginPath(); ctx.moveTo(X,py(0)); ctx.lineTo(X,Y); ctx.lineTo(px(0),Y); ctx.stroke(); ctx.restore();
      ctx.fillStyle=T.surface; ctx.beginPath(); ctx.arc(X,Y,5,0,7); ctx.fill();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X,Y,3,0,7); ctx.fill();
      txt(ctx, Math.round(share)+'%', X+7, Y-9, 'left', T.text,'680',11);
    });

    var slot=PW/Math.max(1,n);

        title:(L?String(L(r)):str('top')+(i+1)),
        rows:[{name:str('concentrationTopN',{n:i+1}),val:Math.round(q3.y*10)/10+'%'},
              {name:str('total'),val:fmt(cum)+' / '+fmt(total)}]};
      c.hits.push({x:px(q3.x)-slot,y:pad.t,w:slot,h:PH,title:d.title,rows:d.rows,note:d.note});
    });

  });
};

/* value with an uncertainty band, one row per entity.
   This is the chart that lets a report say "the difference is within noise".
   cfg: rows, label, value, lo, hi, ref (optional reference line, e.g. the pooled value)
   A band that crosses `ref` is drawn muted — it is not distinguishable from it. */
VIZ.interval=function(cvs,cfg){
  var L=fld(cfg.label), V=fld(cfg.value), LO=fld(cfg.lo), HI=fld(cfg.hi);
  var fmt=cfg.format||compact, REF=finiteNumber(cfg.ref);
  return mk(cvs,function(ctx,W,H,c){
    var rows=usable(cfg.rows(),[V,LO,HI]), pad={t:16,b:30};
    if(!rows.length){ chartMessage(ctx,W,H); return; }
    ctx.font='600 11.5px system-ui, sans-serif';
    var labelW=Math.min(cfg.labelW||190, Math.max(90,W*(cfg.labelRatio||0.3)));
    var valueW=finiteNumber(cfg.valueW)||96, PW=W-labelW-valueW;
    var rowH=(H-pad.t-pad.b)/rows.length;
    var lo=Math.min.apply(null,rows.map(LO)), hi=Math.max.apply(null,rows.map(HI));
    if(REF!==null){ lo=Math.min(lo,REF); hi=Math.max(hi,REF); }
    var span=(hi-lo)||1; lo-=span*0.08; hi+=span*0.08;
    var px=function(v){ return labelW+PW*(v-lo)/(hi-lo); };

    ctx.font='11px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';

      var x=Math.round(px(v))+.5;
      ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
      ctx.fillText((cfg.tickFormat||compact)(v), x, H-pad.b+7); });
    ctx.restore();
    if(REF!==null){                    /* the line a band either clears or does not */
      var rx=Math.round(px(REF))+.5;
      ctx.save(); ctx.strokeStyle=T.text2; ctx.lineWidth=1.5; ctx.setLineDash([5,3]);
      ctx.beginPath(); ctx.moveTo(rx,pad.t-4); ctx.lineTo(rx,H-pad.b); ctx.stroke(); ctx.restore();
      txt(ctx,(cfg.refLabel||str('reference'))+' '+fmt(REF),rx,pad.t-11,'center',T.text2,'650',10.5);
    }
    rows.forEach(function(r,i){
      var cy=pad.t+rowH*i+rowH/2, v=V(r), a=LO(r), b=HI(r);
      var crosses = REF===null ? false : (a<=REF && b>=REF);
      /* colour says only "clears the reference or not"; the sign is printed too,
         so direction is never carried by colour alone */
      var col = REF===null ? colorOf(cfg.color,T.s1)
              : crosses ? T.muted : (v>REF?T.pos:T.neg);
      var k=c.t, mid=px(v), x1=mid+(px(a)-mid)*k, x2=mid+(px(b)-mid)*k;
      ctx.font='600 11.5px system-ui, sans-serif';
      txt(ctx, ell(ctx,L(r),labelW-12), labelW-10, cy, 'right', T.text2,'600',11.5);
      ctx.save();
      ctx.fillStyle=rgba(col,.22); ctx.fillRect(x1,cy-7,Math.max(1,x2-x1),14);
      ctx.strokeStyle=col; ctx.lineWidth=1;
      [x1,x2].forEach(function(x){ ctx.beginPath();
        ctx.moveTo(Math.round(x)+.5,cy-7); ctx.lineTo(Math.round(x)+.5,cy+7); ctx.stroke(); });
      ctx.beginPath(); ctx.moveTo(x1,cy); ctx.lineTo(x2,cy); ctx.stroke();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(mid,cy,4,0,7); ctx.fill();
      ctx.restore();
      if(c.t>=1){
        ctx.save(); ctx.font='650 11.5px system-ui, sans-serif';
        var lx=clampLabel(ctx,fmt(v),W-4,'right',labelW+4,W-4); ctx.restore();
        txt(ctx,fmt(v),lx,cy,'right',T.text2,'650',11.5);
      }
      var d=cfg.tip?cfg.tip(r,i,rows,{crosses:crosses}):{title:String(L(r)),
        rows:[{name:cfg.seriesName||str('value'),val:fmt(v),color:col},
              {name:str('intervalBand'),val:fmt(a)+' – '+fmt(b)}],
        note: REF===null?null:(crosses?str('intervalCrosses'):str('intervalClears'))};
      c.hits.push({x:0,y:cy-rowH/2,w:W,h:rowH,title:d.title,rows:d.rows,note:d.note});
    });
    dropNote(ctx,W,H,rows);
  });

/* ── table builder (the table twin every chart owes the reader) ───────────── */
function buildTable(tableEl, cols, rows, opt){
  opt=opt||{};
  while(tableEl.firstChild) tableEl.removeChild(tableEl.firstChild);
  if(opt.caption) tableEl.appendChild(el('caption',null,opt.caption));
  var htr=el('tr');
  cols.forEach(function(col,ci){
    var th=el('th',null,col.name); th.scope='col';
    if(opt.sortable){
      th.className='sortable'; th.tabIndex=0;
      var go=function(){
        var dir=(tableEl.__sort===ci&&tableEl.__dir===-1)?1:-1;
        tableEl.__sort=ci; tableEl.__dir=dir;
        var sorted=rows.slice().sort(function(a,b){
          var x=col.sortVal?col.sortVal(a):col.value(a), y=col.sortVal?col.sortVal(b):col.value(b);
          if(typeof x==='string'||typeof y==='string') return String(x).localeCompare(String(y),LANG)*dir*-1;
          return (x-y)*dir*-1;
        });
        buildTable(tableEl,cols,sorted,Object.assign({},opt,{_s:ci,_d:dir}));
      };
      th.addEventListener('click',go);
      th.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
      if(opt._s===ci) th.setAttribute('aria-sort', opt._d===-1?'descending':'ascending');
    }
    htr.appendChild(th);
  });
  var thead=el('thead'); thead.appendChild(htr); tableEl.appendChild(thead);
  var tb=el('tbody');
  rows.forEach(function(r){
    var tr=el('tr');
    cols.forEach(function(col){
      var td=el('td'); if(col.num!==false) td.className='num';
      td.textContent=col.value(r);
      if(col.cls) td.className=(td.className+' '+col.cls(r)).trim();
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  tableEl.appendChild(tb);
  if(opt.sortable){ tableEl.__sort=opt._s; tableEl.__dir=opt._d; }
  return tableEl;
}
/* auto-wire any button carrying data-table-toggle="id" */
function wireToggles(root){
  (root||document).querySelectorAll('[data-table-toggle]').forEach(function(b){
    if(b.__wired) return; b.__wired=true;
    b.addEventListener('click',function(){

      if(open) t.removeAttribute('hidden'); else t.setAttribute('hidden','');
      b.setAttribute('aria-expanded',String(open));
      b.textContent=open?(b.dataset.labelOpen||str('tableHide')):(b.dataset.labelClosed||str('tableShow'));
    });

}

  if(chart.type==='panels')return {rows:function(){return rows;},label:e.label,
    panels:series.map(function(s){return {title:s.name,get:s.get,color:s.color};}),format:format};
  if(chart.type==='interval')return Object.assign(base,{label:e.label,value:e.value,lo:e.lo,hi:e.hi,format:format});
  if(chart.type==='scatter')return Object.assign(base,{label:e.label,x:e.x,y:e.y,format:format});
  if(chart.type==='dumbbell')return Object.assign(base,{label:e.label,before:e.before,after:e.after,format:format});
  if(chart.type==='bullet')return Object.assign(base,{label:e.label,value:e.value,target:e.target,format:format});
  if(chart.type==='histogram')return Object.assign(base,{value:e.value,format:format});
  /* spark takes a value list, not rows: it has no axes and reads no x. Row order
     is the source's, exactly as it is for line and stackedArea. */
  if(chart.type==='spark')return {values:function(){return rows.map(function(r){return Number(r[e.value]);});},color:'s1'};
  throw new Error('unsupported validated chart type: '+chart.type);
}
/* A multi-series chart is unreadable without a key, and the key has to survive the
   theme toggle — the swatch colour is a token value, not a class. R.onTheme runs the
   hook now and again on every change. `panels` is not here: it prints each metric's
   name above its own panel, so a second key would only repeat it. */
function legendFor(chart,card){
  var series=seriesOf(chart);
  if(series.length<2||(chart.type!=='columns'&&chart.type!=='stackedArea'))return;
  var node=add(card,text('div','legend',''));
  R.onTheme(function(t){
    node.replaceChildren.apply(node,series.map(function(s){
      var span=R.el('span',null,''),key=R.el('i','key sq','');
      key.style.background=t[s.color];span.appendChild(key);
      span.appendChild(document.createTextNode(s.name));return span;
    }));
  });
}
document.documentElement.lang=S.metadata.locale;
document.title=S.metadata.title;
document.getElementById('hEyebrow').textContent=S.metadata.eyebrow;
document.getElementById('hTitle').textContent=S.metadata.title;
document.getElementById('hSub').textContent=S.metadata.subtitle;
document.getElementById('hMeta').replaceChildren(text('span',null,L.grain+': '+S.grain));
/* The masthead archetype is a plan choice, and until now it was recorded in the
   spec and never applied — every report rendered as M1 whatever it declared.
   M4 and M5 need content the plan has no field for, so validate-plan.py refuses
   them rather than letting them render as something else. */
var MASTHEADS={M1:'',M2:'masthead--figure',M3:'masthead--broadsheet',M6:'masthead--sticky'};
var header=document.querySelector('.masthead'), archetype=MASTHEADS[S.masthead]||'';
if(header&&archetype)header.classList.add(archetype);
var heroFigure=document.getElementById('hFig');
if(heroFigure){
  var fig=S.masthead==='M2'?S.masthead_figure:null;
  if(fig){
    heroFigure.replaceChildren(document.createTextNode(fig.value),text('small',null,fig.label));
    heroFigure.hidden=false;
  } else { heroFigure.textContent=''; heroFigure.hidden=true; }
}
if(header&&S.masthead==='M6')R.shrinkMasthead(header,140);
var main=document.getElementById('main');main.replaceChildren();
if(S.insights.length){
  var summary=add(main,text('section','reveal','')),list=add(summary,text('div','insights',''));
  S.insights.forEach(function(insight){var card=add(list,text('article','insight',''));add(card,text('h3',null,insight.claim));add(card,text('p',null,insight.limitation));});
}
var sections={};
S.sections.forEach(function(section,index){
  var node=add(main,text('section','reveal',''));node.id=section.id;
  var head=add(node,text('div','sec-head',''));add(head,text('p','sec-num',String(index+1).padStart(2,'0')));add(head,text('h2',null,section.title));add(head,text('p','lede',section.lede));
  sections[section.id]=node;
});
S.charts.forEach(function(chart){
  var section=sections[chart.section_id],card=add(section,text('div','card','')),head=add(card,text('div','card-head','')),title=add(head,text('h3',null,chart.title));title.id='title-'+chart.id;
  title.appendChild(R.helpDot(chart.title,chart.help));
  var button=add(head,text('button','btn',L.table));button.type='button';button.setAttribute('data-table-toggle','tablewrap-'+chart.id);button.setAttribute('aria-expanded','false');
  add(card,text('p','card-note',chart.note));legendFor(chart,card);
  var chartWrap=add(card,text('div','chart','')),canvas=add(chartWrap,document.createElement('canvas'));
  canvas.id=chart.id;canvas.height=chart.height||240;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',chart.aria_label);canvas.dataset.motionEnabled=String(chart.motion.enabled);canvas.dataset.motionReason=chart.motion.reason;canvas.dataset.motionKind=chart.motion.kind||'entry';canvas.dataset.motionTrigger=chart.motion.trigger||'on-view';canvas.dataset.motionDuration=String(chart.motion.duration_ms||700);canvas.dataset.motionEasing=chart.motion.easing||'outCubic';canvas.dataset.motionSource=chart.motion.source_tool||'motion';canvas.dataset.motionIntegration=toolIntegration(chart.motion.source_tool||'motion');
  var tableWrap=add(card,text('div','tablewrap',''));tableWrap.id='tablewrap-'+chart.id;tableWrap.hidden=true;var table=add(tableWrap,document.createElement('table'));table.id='table-'+chart.id;
  var factory=R.VIZ[chart.type];if(typeof factory!=='function')throw new Error('runtime lacks '+chart.type);factory(canvas,withOptions(chart,chartConfig(chart)));
  R.buildTable(table,chart.table.columns.map(function(field){return {name:field,value:function(row){return format(row[field]);},num:false};}),rows,{caption:chart.title+L.data});
});
var method=add(main,text('section','reveal',''));method.id='methodology';var mh=add(method,text('div','sec-head',''));add(mh,text('p','sec-num',L.method));add(mh,text('h2',null,L.methodTitle));var mc=add(method,text('div','card method',''));
[[L.basis,S.methodology.basis],[L.formulas,S.methodology.formulas],[L.limits,S.methodology.limitations]].forEach(function(group){var block=add(mc,text('div',null,''));add(block,text('h3',null,group[0]));group[1].forEach(function(item){add(block,text('p',null,item));});});
R.wireHelp();R.wireToggles();R.reveal();R.paintAll();
S.charts.forEach(function(chart){
  if(!chart.motion.enabled)return;
  var canvas=document.getElementById(chart.id),engine=canvas&&canvas.__chart;
  if(!engine)return;
  var vendored=canvas.dataset.motionIntegration==='vendored-runtime'&&hasVendoredRuntime(chart.motion.source_tool);
  canvas.__reportReplay=vendored?function(){playVendoredMotion(canvas,engine,chart);}:function(){engine.play(chart.motion.duration_ms||700,chart.motion.easing||'outCubic');};
  R.onView(canvas,canvas.__reportReplay);
});
})();
</script>
